name: Apply K prop redesign

on:
  pull_request:
    branches:
      - feat/mlb-k-prop-table-and-splits-redesign

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - id: guard
        name: Check whether redesign is already applied
        run: |
          if grep -q "Signed numeric edge only" src/pages/MlbStrikeoutProps.tsx; then
            echo "apply=false" >> "$GITHUB_OUTPUT"
          else
            echo "apply=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.apply == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - if: steps.guard.outputs.apply == 'true'
        name: Recover and apply reviewed transformer
        run: |
          git fetch origin 60610b76c713ebc236e98ba99a14f930287194f9
          git show 60610b76c713ebc236e98ba99a14f930287194f9:.github/workflows/apply-k-prop-redesign-temp.yml \
            | sed -n '/^      - name: Apply source changes$/,/^      - name: Install dependencies$/p' \
            | sed '1,3d;$d;s/^          //' > /tmp/apply-k-redesign.py
          python /tmp/apply-k-redesign.py
      - if: steps.guard.outputs.apply == 'true'
        name: Install dependencies
        run: npm ci
      - if: steps.guard.outputs.apply == 'true'
        name: Typecheck
        run: npx tsc --noEmit
      - if: steps.guard.outputs.apply == 'true'
        name: Focused tests
        run: npx vitest run src/pages/MlbStrikeoutProps*.test.tsx src/components/mlb/MlbStrikeoutPropRowDetail*.test.tsx --passWithNoTests
      - if: steps.guard.outputs.apply == 'true'
        name: Build
        run: npm run build
      - if: steps.guard.outputs.apply == 'true'
        name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/MlbStrikeoutProps.tsx src/components/mlb/MlbStrikeoutPropRowDetail.tsx
          git diff --cached --check
          git commit -m "feat: redesign MLB K prop table and pitcher splits [k-redesign-applied]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
