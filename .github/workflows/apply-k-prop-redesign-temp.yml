name: Apply K prop redesign

on:
  pull_request:
    branches:
      - feat/mlb-k-prop-table-and-splits-redesign

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - id: guard
        run: |
          if grep -q "Signed numeric edge only" src/pages/MlbStrikeoutProps.tsx; then echo "apply=false" >> "$GITHUB_OUTPUT"; else echo "apply=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.guard.outputs.apply == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - if: steps.guard.outputs.apply == 'true'
        name: Apply refreshed transformer
        run: |
          git fetch origin feat/mlb-k-prop-table-and-splits-redesign
          git show origin/feat/mlb-k-prop-table-and-splits-redesign:.github/workflows/apply-k-prop-redesign-temp.yml > /tmp/base-workflow.yml
          awk '
            /name: Apply source changes/ { found=1; next }
            found && /run: \|/ { script=1; next }
            script && /^      - if:/ { exit }
            script { sub(/^          /, ""); print }
          ' /tmp/base-workflow.yml > /tmp/apply-k-redesign.py
          python /tmp/apply-k-redesign.py
      - if: steps.guard.outputs.apply == 'true'
        run: npm ci
      - if: steps.guard.outputs.apply == 'true'
        run: npx tsc --noEmit
      - if: steps.guard.outputs.apply == 'true'
        run: npx vitest run src/pages/MlbStrikeoutProps*.test.tsx src/components/mlb/MlbStrikeoutPropRowDetail*.test.tsx --passWithNoTests
      - if: steps.guard.outputs.apply == 'true'
        run: npm run build
      - if: steps.guard.outputs.apply == 'true'
        name: Commit validated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/MlbStrikeoutProps.tsx src/components/mlb/MlbStrikeoutPropRowDetail.tsx
          git diff --cached --check
          git commit -m "feat: redesign MLB K prop table and pitcher splits [k-redesign-applied]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
