name: Apply K prop redesign

on:
  pull_request:
    branches:
      - feat/mlb-k-prop-table-and-splits-redesign

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - id: guard
        name: Check whether redesign is already applied
        run: |
          if grep -q "Signed numeric edge only" src/pages/MlbStrikeoutProps.tsx; then
            echo "apply=false" >> "$GITHUB_OUTPUT"
          else
            echo "apply=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.apply == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - if: steps.guard.outputs.apply == 'true'
        name: Apply source changes
        shell: python
        run: |
          from pathlib import Path
          import re

          page_path = Path("src/pages/MlbStrikeoutProps.tsx")
          s = page_path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              s = s.replace(old, new, 1)

          replace_once('/** "+0.7 OVER" / "-1.1 UNDER" / "—" for neutral or unavailable rows. */', '/** Signed numeric edge only; color communicates OVER (amber) vs UNDER (blue). */', 'edge comment')
          replace_once('return `${sign}${info.projectionEdge.toFixed(1)} ${info.direction.toUpperCase()}`;', 'return `${sign}${info.projectionEdge.toFixed(1)}`;', 'edge label')

          venue_anchor = '''function resolveVenueIndicator(row: PitcherStrikeoutTeamRow) {
            const [away, home] = String(row.gameKey ?? "").split("@").map((team) => team.trim().toUpperCase());
            const team = row.team.trim().toUpperCase();
            if (team && home && team === home) return "Home";
            if (team && away && team === away) return "Away";
            return "N/A";
          }
          '''
          venue_helpers = venue_anchor + '''
          function venuePillClass(venue: string) {
            if (venue === "Home") return "border-emerald-200 bg-emerald-50 text-emerald-700";
            if (venue === "Away") return "border-sky-200 bg-sky-50 text-sky-700";
            return "border-slate-200 bg-white text-slate-500";
          }

          function perNine(total: number | null | undefined, outs: number | null | undefined) {
            if (total == null || outs == null || !Number.isFinite(total) || !Number.isFinite(outs) || outs <= 0) return null;
            return (total * 27) / outs;
          }

          function weightedRate(values: Array<{ rate: number | null | undefined; weight: number | null | undefined }>) {
            let numerator = 0;
            let denominator = 0;
            for (const value of values) {
              if (value.rate == null || !Number.isFinite(value.rate)) continue;
              const weight = value.weight != null && Number.isFinite(value.weight) && value.weight > 0 ? value.weight : 1;
              numerator += value.rate * weight;
              denominator += weight;
            }
            return denominator > 0 ? numerator / denominator : null;
          }
          '''
          replace_once(venue_anchor, venue_helpers, 'venue helpers')

          stale_anchor = '  const isDetailsStale = Boolean(detailsDate && slateDate && detailsDate !== slateDate);\n'
          metrics = stale_anchor + '''

          const getDisplayMetrics = (row: PitcherStrikeoutTeamRow) => {
            const detail = isDetailsStale ? undefined : detailsByKey.get(keyForStrikeoutPropRow(row, slateDate));
            const home = detail?.pitcherVenueSplits?.home?.season;
            const away = detail?.pitcherVenueSplits?.away?.season;
            const seasonOuts = (home?.totalOuts ?? 0) + (away?.totalOuts ?? 0);
            const seasonKs = home?.strikeouts != null && away?.strikeouts != null ? home.strikeouts + away.strikeouts : null;
            const venue = resolveVenueIndicator(row);
            const venueSplit = venue === "Home" ? home : venue === "Away" ? away : undefined;

            const pitcher = dashboard?.pitchers.find((candidate) =>
              (row.pitcherId != null && candidate.pitcherId === row.pitcherId)
              || (candidate.pitcher === row.pitcher && candidate.gameKey === row.gameKey)
            );
            const hand = String(pitcher?.hand ?? "").toUpperCase();
            const opponentBatters = dashboard?.batters.filter((batter) => batter.gameKey === row.gameKey && batter.team === row.opponent) ?? [];
            const seasonVsHand = weightedRate(opponentBatters.map((batter) => {
              const split = hand.startsWith("L") ? batter.handednessSplits?.vsLeft : hand.startsWith("R") ? batter.handednessSplits?.vsRight : null;
              return { rate: split?.strikeoutRate ?? null, weight: split?.plateAppearances ?? null };
            }));

            const context = detail as (typeof detail & {
              opponentContext?: {
                home?: { kPerNine?: number | null; xba?: number | null };
                away?: { kPerNine?: number | null; xba?: number | null };
                last10?: { xba?: number | null };
              };
            });
            const opponentSite = venue === "Home" ? "away" : venue === "Away" ? "home" : null;
            const siteContext = opponentSite ? context?.opponentContext?.[opponentSite] : undefined;

            return {
              pitcherSeasonK9: perNine(seasonKs, seasonOuts || null),
              seasonVsHand,
              pitcherLast5K9: detail?.pitcherLastFiveSummary?.strikeoutsPerNine ?? null,
              opponentLast10K9: detail?.opponentLastFiveVsStartersSummary?.averageTeamStrikeouts ?? null,
              pitcherKRateSplit: venueSplit?.strikeoutRate ?? null,
              opponentK9Split: siteContext?.kPerNine ?? null,
              opponentXbaSplit: siteContext?.xba ?? null,
              opponentXbaLast10: context?.opponentContext?.last10?.xba ?? null,
            };
          };
          '''
          replace_once(stale_anchor, metrics, 'display metrics')

          sort_pattern = re.compile(r'''                <div className="mt-2\.5 flex flex-wrap items-center gap-1\.5">.*?                <p className="mt-2 text-xs leading-5 text-slate-500">Best Value ranks the largest differences between the model and sportsbook line\. It includes both OVER and UNDER opportunities\.</p>''', re.S)
          sort_new = '''                <div className="mt-3">
                  <span className="mb-1.5 block text-[10px] font-black uppercase tracking-wide text-slate-400">Sort</span>
                  <div className="grid grid-cols-3 gap-2 sm:flex sm:flex-wrap">
                    <button type="button" onClick={() => { setSortKey("strikeoutMatchupScore"); setSortDir("desc"); }} aria-pressed={sortKey === "strikeoutMatchupScore"} className={cn("min-w-0 rounded-xl border px-2.5 py-2 text-left text-[11px] font-black leading-tight shadow-sm transition sm:min-w-[132px]", sortKey === "strikeoutMatchupScore" ? "border-emerald-600 bg-emerald-600 text-white shadow-emerald-100" : "border-emerald-200 bg-emerald-50 text-emerald-800 hover:border-emerald-400")}>
                      Most Strikeouts
                      <span className={cn("mt-0.5 block text-[9px] font-semibold", sortKey === "strikeoutMatchupScore" ? "text-emerald-50" : "text-emerald-600")}>K Score ↓</span>
                    </button>
                    <button type="button" onClick={() => { setSortKey("absoluteProjectionEdge"); setSortDir("desc"); }} aria-pressed={sortKey === "absoluteProjectionEdge"} className={cn("min-w-0 rounded-xl border px-2.5 py-2 text-left text-[11px] font-black leading-tight shadow-sm transition sm:min-w-[132px]", sortKey === "absoluteProjectionEdge" ? "border-violet-600 bg-violet-600 text-white shadow-violet-100" : "border-violet-200 bg-violet-50 text-violet-800 hover:border-violet-400")}>
                      Best Value
                      <span className={cn("mt-0.5 block text-[9px] font-semibold", sortKey === "absoluteProjectionEdge" ? "text-violet-50" : "text-violet-600")}>Largest edge</span>
                    </button>
                    <button type="button" onClick={() => { setSortKey("gameStartTime"); setSortDir("asc"); }} aria-pressed={sortKey === "gameStartTime"} className={cn("min-w-0 rounded-xl border px-2.5 py-2 text-left text-[11px] font-black leading-tight shadow-sm transition sm:min-w-[132px]", sortKey === "gameStartTime" ? "border-slate-700 bg-slate-700 text-white shadow-slate-100" : "border-slate-300 bg-slate-50 text-slate-700 hover:border-slate-500")}>
                      Game Time
                      <span className={cn("mt-0.5 block text-[9px] font-semibold", sortKey === "gameStartTime" ? "text-slate-100" : "text-slate-500")}>Earliest first</span>
                    </button>
                  </div>
                </div>
                <p className="mt-2 text-xs leading-5 text-slate-500">Most Strikeouts ranks K Score descending. Best Value ranks the largest model-to-line differences. Game Time shows the earliest starts first.</p>'''
          s, n = sort_pattern.subn(sort_new, s, count=1)
          if n != 1: raise SystemExit(f'sort controls: expected 1 match, found {n}')

          # Add the derived display bundle to both primary row renderers.
          s, n = re.subn(r'(const venueIndicator = resolveVenueIndicator\(row\);\n)(\s+return \()', r'\1                      const displayMetrics = getDisplayMetrics(row);\n\2', s, count=1)
          if n != 1: raise SystemExit('mobile display metrics insertion failed')
          s, n = re.subn(r'(const venueIndicator = resolveVenueIndicator\(row\);\n)(\s+const onRowKeyDown)', r'\1                      const displayMetrics = getDisplayMetrics(row);\n\2', s, count=1)
          if n != 1: raise SystemExit('desktop display metrics insertion failed')

          old_mobile = '''                                  <MetricTile label="K%"><span className="text-[11px] font-semibold text-slate-700">{fmt(row.pitcherKRate)}%</span></MetricTile>
                                  <MetricTile label="Whiff%"><span className="text-[11px] font-semibold text-slate-700">{fmt(row.pitcherWhiffRate)}%</span></MetricTile>
                                  <MetricTile label="K VS"><StatScorePill value={row.pitcherKVs} /></MetricTile>
                                  <MetricTile label="Pitcher K"><StatScorePill value={row.pitcherKSkillScore} /></MetricTile>
                                  <MetricTile label="Opp K%"><span className="text-[11px] font-semibold text-slate-700">{fmt(row.opponentTeamKRate)}%</span></MetricTile>
                                  <MetricTile label="Opp Whiff%"><span className="text-[11px] font-semibold text-slate-700">{fmt(row.opponentTeamWhiffRate)}%</span></MetricTile>
                                  <MetricTile label="Opp K Score"><StatScorePill value={row.opponentTeamStrikeoutScore} /></MetricTile>
                                  <MetricTile label="Venue"><span className="text-[11px] font-semibold text-slate-700">{venueIndicator}</span></MetricTile>
                                  <MetricTile label="K/9"><span className="text-[11px] font-semibold text-slate-700">{fmt(row.projectedK9)}</span></MetricTile>
                                  <MetricTile label="Avg IP"><span className="text-[11px] font-semibold text-slate-700">{fmt(row.projectedIP)}</span></MetricTile>'''
          new_mobile = '''                                  <MetricTile label="K/9 - SZN"><span className="text-[11px] font-semibold text-slate-700">{fmt(displayMetrics.pitcherSeasonK9)}</span></MetricTile>
                                  <MetricTile label="Szn vs Hand"><span className="text-[11px] font-semibold text-slate-700">{displayMetrics.seasonVsHand == null ? DASH : `${fmt(displayMetrics.seasonVsHand)}%`}</span></MetricTile>
                                  <MetricTile label="K/9 - Last 5"><span className="text-[11px] font-semibold text-slate-700">{fmt(displayMetrics.pitcherLast5K9)}</span></MetricTile>
                                  <MetricTile label="Opp K/9 Last 10"><span className="text-[11px] font-semibold text-slate-700">{fmt(displayMetrics.opponentLast10K9)}</span></MetricTile>
                                  <MetricTile label="K% Split"><span className="text-[11px] font-semibold text-slate-700">{displayMetrics.pitcherKRateSplit == null ? DASH : `${fmt(displayMetrics.pitcherKRateSplit)}%`}</span></MetricTile>
                                  <MetricTile label="Opp K/9 Split"><span className="text-[11px] font-semibold text-slate-700">{fmt(displayMetrics.opponentK9Split)}</span></MetricTile>
                                  <MetricTile label="Opp xBA Split"><span className="text-[11px] font-semibold text-slate-700">{fmt(displayMetrics.opponentXbaSplit, 3)}</span></MetricTile>
                                  <MetricTile label="Opp xBA Last 10"><span className="text-[11px] font-semibold text-slate-700">{fmt(displayMetrics.opponentXbaLast10, 3)}</span></MetricTile>
                                  <MetricTile label="Avg IP"><span className="text-[11px] font-semibold text-slate-700">{fmt(row.projectedIP)}</span></MetricTile>'''
          replace_once(old_mobile, new_mobile, 'mobile metrics')

          header_pattern = re.compile(r'''\{hasKOdds && <th className="border-b border-slate-200 bg-slate-50.*?<th className="hidden border-b border-slate-200 bg-slate-50 px-2 py-2 text-left text-\[10px\] font-black uppercase tracking-widest text-slate-500 xl:table-cell">Avg IP</th>''', re.S)
          header_new = '''{hasKOdds && <th className="border-b border-slate-200 bg-slate-50 px-2 py-2 text-left text-[10px] font-black uppercase tracking-widest text-slate-500 whitespace-nowrap">K Line</th>}{hasKOdds && <SortTh k="projectedKs" label="Proj K" />}{hasKOdds && <SortTh k="absoluteProjectionEdge" label="Edge" />}<SortTh k="strikeoutMatchupScore" label="K Score" />
                      {(["K/9 - SZN", "Szn vs Hand", "K/9 - Last 5", "Opp K/9 Last 10", "K% Split", "Opp K/9 Split", "Opp xBA Split", "Opp xBA Last 10"] as const).map((label) => <th key={label} className="border-b border-slate-200 bg-slate-50 px-2 py-2 text-left text-[9px] font-black uppercase tracking-wide text-slate-500 whitespace-nowrap">{label}</th>)}
                      <th className="border-b border-slate-200 bg-slate-50 px-2 py-2 text-left text-[10px] font-black uppercase tracking-widest text-slate-500 whitespace-nowrap">Avg IP</th>'''
          s, n = header_pattern.subn(header_new, s, count=1)
          if n != 1: raise SystemExit(f'desktop headers: expected 1 match, found {n}')

          row_pattern = re.compile(r'''</td><td className="border-b border-slate-100 px-2 py-1">\{fmt\(row\.pitcherKRate\)\}%</td>.*?<td className="hidden border-b border-slate-100 px-2 py-1 font-semibold xl:table-cell">\{fmt\(row\.projectedIP\)\}</td>''', re.S)
          row_new = '''</td>
                      <td className="border-b border-slate-100 px-2 py-1 font-semibold tabular-nums">{fmt(displayMetrics.pitcherSeasonK9)}</td>
                      <td className="border-b border-slate-100 px-2 py-1 font-semibold tabular-nums">{displayMetrics.seasonVsHand == null ? DASH : `${fmt(displayMetrics.seasonVsHand)}%`}</td>
                      <td className="border-b border-slate-100 px-2 py-1 font-semibold tabular-nums">{fmt(displayMetrics.pitcherLast5K9)}</td>
                      <td className="border-b border-slate-100 px-2 py-1 font-semibold tabular-nums">{fmt(displayMetrics.opponentLast10K9)}</td>
                      <td className="border-b border-slate-100 px-2 py-1 font-semibold tabular-nums">{displayMetrics.pitcherKRateSplit == null ? DASH : `${fmt(displayMetrics.pitcherKRateSplit)}%`}</td>
                      <td className="border-b border-slate-100 px-2 py-1 font-semibold tabular-nums">{fmt(displayMetrics.opponentK9Split)}</td>
                      <td className="border-b border-slate-100 px-2 py-1 font-semibold tabular-nums">{fmt(displayMetrics.opponentXbaSplit, 3)}</td>
                      <td className="border-b border-slate-100 px-2 py-1 font-semibold tabular-nums">{fmt(displayMetrics.opponentXbaLast10, 3)}</td>
                      <td className="border-b border-slate-100 px-2 py-1 font-semibold tabular-nums">{fmt(row.projectedIP)}</td>'''
          s, n = row_pattern.subn(row_new, s, count=1)
          if n != 1: raise SystemExit(f'desktop metric cells: expected 1 match, found {n}')

          replace_once('"sticky left-0 z-10 border-b border-r border-slate-100 px-2 py-1 text-[10px] font-black text-slate-400"', '"sticky left-0 z-10 border-b border-r border-slate-100 px-2 py-1 text-[12px] font-black tabular-nums text-slate-600"', 'rank emphasis')
          replace_once('<span className="shrink-0 rounded-full border border-slate-200 bg-white px-1.5 py-0.5 text-[8px] font-black uppercase tracking-wide text-slate-500">{venueIndicator}</span>', '<span className={cn("shrink-0 rounded-full border px-1.5 py-0.5 text-[8px] font-black uppercase tracking-wide", venuePillClass(venueIndicator))}>{venueIndicator}</span>', 'venue pill')
          replace_once('const desktopColumnCount = hasKOdds ? 16 : 13;', 'const desktopColumnCount = hasKOdds ? 16 : 13;', 'desktop col count')
          s = s.replace('colSpan={hasKOdds ? 15 : 12}', 'colSpan={hasKOdds ? 16 : 13}', 1)
          page_path.write_text(s, encoding="utf-8")

          detail_path = Path("src/components/mlb/MlbStrikeoutPropRowDetail.tsx")
          d = detail_path.read_text(encoding="utf-8")
          d = d.replace('import { useState, type CSSProperties, type ReactNode } from "react";', 'import { useState, type ReactNode } from "react";', 1)
          d = d.replace('import { MLB_LEAGUE_AVERAGES } from "@/lib/mlb/mlbLeagueAverages";\n', '', 1)
          constants_pattern = re.compile(r'''// League-average pitcher K%.*?const DASH = "N/A";''', re.S)
          d, n = constants_pattern.subn('const DASH = "N/A";', d, count=1)
          if n != 1: raise SystemExit('detail constants cleanup failed')

          helper_pattern = re.compile(r'''// Bounded diverging scale:.*?function pitcherVenueRow\(split: PitcherVenueSplit, label: string\): ReactNode\[\] \{.*?\n\}\n\nfunction PanelCard''', re.S)
          helper_new = '''function ratePerNine(total: number | null | undefined, outs: number | null | undefined) {
            if (total == null || outs == null || !Number.isFinite(total) || !Number.isFinite(outs) || outs <= 0) return null;
            return (total * 27) / outs;
          }

          function signedTone(value: number | null, invert = false) {
            if (value == null || !Number.isFinite(value) || Math.abs(value) < 0.0001) return "bg-slate-100 text-slate-600";
            const favorable = invert ? value < 0 : value > 0;
            return favorable ? "bg-emerald-100 text-emerald-800" : "bg-red-100 text-red-700";
          }

          function DifferenceCell({ value, percent = false, invert = false }: { value: number | null; percent?: boolean; invert?: boolean }) {
            return <span className={cn("inline-block rounded px-1.5 py-0.5 font-black tabular-nums", signedTone(value, invert))}>{value == null ? DASH : `${value > 0 ? "+" : ""}${value.toFixed(percent ? 0 : 1)}${percent ? "%" : ""}`}</span>;
          }

          function pitcherVenueRow(split: PitcherVenueSplit, label: string, overallK9: number | null, overallH9: number | null): ReactNode[] {
            const seasonK9 = ratePerNine(split.season.strikeouts, split.season.totalOuts);
            const seasonH9 = ratePerNine(split.season.hitsAllowed, split.season.totalOuts);
            const last5K9 = ratePerNine(split.lastFiveAtSite.strikeouts, split.lastFiveAtSite.totalOuts);
            const last5H9 = ratePerNine(split.lastFiveAtSite.hitsAllowed, split.lastFiveAtSite.totalOuts);
            const seasonKDiff = seasonK9 != null && overallK9 != null ? seasonK9 - overallK9 : null;
            const last5KDiff = last5K9 != null && overallK9 != null ? last5K9 - overallK9 : null;
            const seasonHDiffPct = seasonH9 != null && overallH9 != null && overallH9 > 0 ? ((seasonH9 - overallH9) / overallH9) * 100 : null;
            const last5HDiffPct = last5H9 != null && overallH9 != null && overallH9 > 0 ? ((last5H9 - overallH9) / overallH9) * 100 : null;
            const shortSample = split.lastFiveAtSite.gamesUsed < 5;
            return [
              label,
              formatVenueInnings(split.season),
              fmtFixed(seasonK9),
              <DifferenceCell key="season-k-diff" value={seasonKDiff} />,
              fmtFixed(seasonH9),
              <DifferenceCell key="season-h-diff" value={seasonHDiffPct} percent invert />,
              <span key="last5-ip">{formatVenueInnings(split.lastFiveAtSite)}{shortSample ? <sup className="ml-0.5 font-black text-amber-700">*</sup> : null}</span>,
              fmtFixed(last5K9),
              <DifferenceCell key="last5-k-diff" value={last5KDiff} />,
              fmtFixed(last5H9),
              <DifferenceCell key="last5-h-diff" value={last5HDiffPct} percent invert />,
            ];
          }

          function PanelCard'''
          d, n = helper_pattern.subn(helper_new, d, count=1)
          if n != 1: raise SystemExit(f'detail helper replacement failed: {n}')

          rows_pattern = re.compile(r'''  const pitcherVenueRows = detail\.pitcherVenueSplits\n    \? \[\n      pitcherVenueRow\(detail\.pitcherVenueSplits\.home, "Home"\),\n      pitcherVenueRow\(detail\.pitcherVenueSplits\.away, "Away"\),\n    \]\n    : \[\];''')
          rows_new = '''  const pitcherSeasonTotals = detail.pitcherVenueSplits ? {
    outs: (detail.pitcherVenueSplits.home.season.totalOuts ?? 0) + (detail.pitcherVenueSplits.away.season.totalOuts ?? 0),
    strikeouts: detail.pitcherVenueSplits.home.season.strikeouts != null && detail.pitcherVenueSplits.away.season.strikeouts != null ? detail.pitcherVenueSplits.home.season.strikeouts + detail.pitcherVenueSplits.away.season.strikeouts : null,
    hits: detail.pitcherVenueSplits.home.season.hitsAllowed != null && detail.pitcherVenueSplits.away.season.hitsAllowed != null ? detail.pitcherVenueSplits.home.season.hitsAllowed + detail.pitcherVenueSplits.away.season.hitsAllowed : null,
  } : null;
  const overallSeasonK9 = pitcherSeasonTotals ? ratePerNine(pitcherSeasonTotals.strikeouts, pitcherSeasonTotals.outs) : null;
  const overallSeasonH9 = pitcherSeasonTotals ? ratePerNine(pitcherSeasonTotals.hits, pitcherSeasonTotals.outs) : null;
  const hasShortVenueSample = Boolean(detail.pitcherVenueSplits && (detail.pitcherVenueSplits.home.lastFiveAtSite.gamesUsed < 5 || detail.pitcherVenueSplits.away.lastFiveAtSite.gamesUsed < 5));
  const pitcherVenueRows = detail.pitcherVenueSplits
    ? [
      pitcherVenueRow(detail.pitcherVenueSplits.home, "Home", overallSeasonK9, overallSeasonH9),
      pitcherVenueRow(detail.pitcherVenueSplits.away, "Away", overallSeasonK9, overallSeasonH9),
    ]
    : [];'''
          d, n = rows_pattern.subn(rows_new, d, count=1)
          if n != 1: raise SystemExit('detail venue rows replacement failed')

          table_pattern = re.compile(r'''            \{detail\.pitcherVenueSplits && \(\n              <MiniTable\n                title=\{`\$\{detail\.pitcher\} — Home/Away Splits`\}.*?              />\n            \)\}''', re.S)
          table_new = '''            {detail.pitcherVenueSplits && (
              <div>
                <MiniTable
                  title={`${detail.pitcher} — Home/Away Splits`}
                  columns={["Site", "IP", "K/9", "K/9 +/-", "H/9", "Hit Avg +/-", "IP", "K/9", "K/9 +/-", "H/9", "Hit Avg +/-"]}
                  columnWidths={["7%", "12%", "8%", "9%", "8%", "11%", "12%", "8%", "9%", "8%", "8%"]}
                  headerGroups={[{ label: "Season", span: 5 }, { label: "Last 5 at Site", span: 5 }]}
                  leadingUngroupedColumns={1}
                  mobileLabels={["Site", "Season IP", "Season K/9", "Season K/9 +/-", "Season H/9", "Season Hit Avg +/-", "Last 5 IP", "Last 5 K/9", "Last 5 K/9 +/-", "Last 5 H/9", "Last 5 Hit Avg +/-"]}
                  rows={pitcherVenueRows}
                  emptyMessage="No venue splits available."
                />
                {hasShortVenueSample && <p className="mt-1 px-1 text-[9px] font-semibold text-amber-700">* fewer than 5 starts available; metrics use all available starts at that site.</p>}
              </div>
            )}'''
          d, n = table_pattern.subn(table_new, d, count=1)
          if n != 1: raise SystemExit(f'detail table replacement failed: {n}')
          detail_path.write_text(d, encoding="utf-8")
      - if: steps.guard.outputs.apply == 'true'
        name: Install dependencies
        run: npm ci
      - if: steps.guard.outputs.apply == 'true'
        name: Typecheck
        run: npx tsc --noEmit
      - if: steps.guard.outputs.apply == 'true'
        name: Focused tests
        run: npx vitest run src/pages/MlbStrikeoutProps*.test.tsx src/components/mlb/MlbStrikeoutPropRowDetail*.test.tsx --passWithNoTests
      - if: steps.guard.outputs.apply == 'true'
        name: Build
        run: npm run build
      - if: steps.guard.outputs.apply == 'true'
        name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/MlbStrikeoutProps.tsx src/components/mlb/MlbStrikeoutPropRowDetail.tsx
          git diff --cached --check
          git commit -m "feat: redesign MLB K prop table and pitcher splits [k-redesign-applied]"
