name: Generate MLB Numerology

# Daily generation at 4:00 AM America/New_York calculates the day's
# numerology numbers and matching players.
#
# Future external scheduler contract:
# first pitch - 60 min -> dispatch Generate MLB Numerology
# The external scheduler is intentionally not implemented in this workflow.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-mlb-numerology.yml"
      - "scripts/lib/numerology-schedule-gate.mjs"
      - "scripts/lib/numerology-gate-runner.mjs"
      - "scripts/lib/mlb-slate-gate.mjs"
      - "scripts/generate-mlb-numerology.mjs"

  schedule:
    - cron: "0 4 * * *"
      timezone: "America/New_York" # 4:00 AM ET daily generation

  workflow_dispatch:
    inputs:
      phase:
        description: "Numerology generation phase"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - morning
          - lineup-confirmed
          - force-refresh
      date:
        description: "Optional Eastern Time slate date (YYYY-MM-DD)"
        required: false
        type: string
      dry_run:
        description: "Generate and validate without committing or writing files"
        required: false
        default: "false"
        type: string
      use_fixture:
        description: "Write to fixture path only - never overwrites production"
        required: false
        default: "false"
        type: string

concurrency:
  # Keep numerology retries from queueing behind every other main-data writer.
  # The push step already rebases/retries against current main.
  group: mlb-numerology-generation-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  slate-check:
    name: Check official MLB slate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_games: ${{ steps.slate.outputs.has_games }}
      game_count: ${{ steps.slate.outputs.game_count }}
      slate_date: ${{ steps.slate.outputs.slate_date }}
      reason: ${{ steps.slate.outputs.reason }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check official MLB schedule
        id: slate
        env:
          REQUESTED_SLATE_DATE: ${{ inputs.date }}
        run: node scripts/lib/mlb-slate-gate.mjs --date "$REQUESTED_SLATE_DATE"

      - name: Summarize successful no-op
        if: steps.slate.outputs.has_games == 'false'
        env:
          SLATE_DATE: ${{ steps.slate.outputs.slate_date }}
        run: |
          echo "No MLB games scheduled for ${SLATE_DATE} ET. Workflow completed as a successful no-op."
          {
            echo "### MLB empty slate"
            echo "No MLB games scheduled for ${SLATE_DATE} ET. Workflow completed as a successful no-op."
            echo "- Official schedule entries: 0"
            echo "- No providers were called."
            echo "- No generated files changed."
            echo "- No commit was attempted."
          } >> "$GITHUB_STEP_SUMMARY"

  generate-numerology:
    name: Generate MLB Numerology
    needs: slate-check
    if: needs.slate-check.outputs.has_games == 'true'
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Evaluate scheduling gate
        id: gate
        run: |
          node scripts/lib/numerology-gate-runner.mjs \
            --phase "${{ inputs.phase || 'auto' }}"

      - name: Log gate result
        run: |
          echo "run=${{ steps.gate.outputs.run }}"
          echo "phase=${{ steps.gate.outputs.phase }}"
          echo "reason=${{ steps.gate.outputs.reason }}"

      - name: Run numerology unit tests
        if: steps.gate.outputs.run == 'true'
        run: npx vitest run src/lib/numerology/numerology.test.ts

      - name: TypeScript check
        if: steps.gate.outputs.run == 'true'
        run: npx tsc --noEmit

      - name: Production build
        if: steps.gate.outputs.run == 'true'
        run: npm run build

      - name: Update player identity cache
        if: steps.gate.outputs.run == 'true'
        run: node scripts/update-player-identity-cache.mjs

      - name: Generate numerology
        if: steps.gate.outputs.run == 'true'
        id: generate
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: |
          DATE_FLAG=""
          if [ -n "${{ inputs.date }}" ]; then
            DATE_FLAG="--date ${{ inputs.date }}"
          fi
          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          FIXTURE_FLAG=""
          if [ "${{ inputs.use_fixture }}" = "true" ]; then
            FIXTURE_FLAG="--fixture"
          fi
          PHASE_FLAG="--phase ${{ steps.gate.outputs.phase }}"
          node scripts/generate-mlb-numerology.mjs $DATE_FLAG $DRY_FLAG $FIXTURE_FLAG $PHASE_FLAG

      - name: Filter to likely active hitters
        if: >-
          steps.gate.outputs.run == 'true' &&
          inputs.dry_run != 'true' &&
          inputs.use_fixture != 'true'
        run: |
          DATE_FLAG=""
          if [ -n "${{ inputs.date }}" ]; then
            DATE_FLAG="--date ${{ inputs.date }}"
          fi
          node scripts/filter-mlb-numerology-active.mjs $DATE_FLAG

      # Persists today's Top Play / Score 50+ selections for the
      # /mlb/performance-preview Results Tracker. This is part of the NORMAL
      # generation lifecycle (not the email pipeline) -- it runs on every
      # phase (morning and lineup-confirmed) and is idempotent, so a rerun
      # later the same day safely refreshes still-pending records instead of
      # duplicating them. continue-on-error because this must never block
      # the core numerology-daily.json publish below; "Enforce" at the end
      # of the job fails the run afterward if this was lost.
      - name: Persist Numerology performance tracking
        id: persist_numerology_tracking
        if: >-
          steps.gate.outputs.run == 'true' &&
          inputs.dry_run != 'true' &&
          inputs.use_fixture != 'true'
        continue-on-error: true
        run: |
          DATE_FLAG=""
          if [ -n "${{ inputs.date }}" ]; then
            DATE_FLAG="--date ${{ inputs.date }}"
          fi
          node scripts/persist-mlb-numerology-performance.mjs $DATE_FLAG

      - name: Commit and push
        if: >-
          steps.gate.outputs.run == 'true' &&
          inputs.dry_run != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            public/data/mlb/numerology-daily.json \
            public/data/mlb/numerology/ \
            public/data/mlb/player-identity-cache.json \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No numerology changes to commit."
            exit 0
          fi

          PHASE_LABEL="${{ steps.gate.outputs.phase }}"
          git commit -m "chore: numerology ${PHASE_LABEL} $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"

          pushed=false
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase failed on attempt ${attempt}; aborting before retry." >&2
              git rebase --abort || true
            elif git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep $((attempt * 10))
          done

          if [ "$pushed" != "true" ]; then
            echo "ERROR: All push attempts failed." >&2
            exit 1
          fi

      # Runs last, after the core numerology-daily.json publish above has
      # already completed -- so a tracking-only failure never blocks the
      # live board. But it does NOT continue-on-error: if persistence
      # failed, today's Top Play/Score 50+ selections are gone for good
      # (see the root-cause note in persist-mlb-numerology-performance.mjs),
      # so the job must end in a failed state rather than pass silently.
      - name: Enforce Numerology performance persistence
        if: steps.gate.outputs.run == 'true' && inputs.dry_run != 'true' && inputs.use_fixture != 'true'
        run: |
          if [ "${{ steps.persist_numerology_tracking.outcome }}" != "success" ]; then
            echo "::error::Numerology performance tracking persistence failed (outcome=${{ steps.persist_numerology_tracking.outcome }}). Today's Top Play/Score 50+ selections were not recorded and cannot be reconstructed later."
            exit 1
          fi
          echo "Numerology performance tracking persisted successfully."
