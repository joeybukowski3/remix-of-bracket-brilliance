name: MLB X Editions
run-name: MLB X Editions • ${{ github.event_name }} • ${{ github.ref_name }}

# Four independent publication targets per MLB slate: k-morning, hr-morning,
# k-confirmed, hr-confirmed. Each run is self-sufficient -- inside an open
# window with everything it needs, the answer is POST, not "wait for a better
# run" (see scripts/lib/mlb-x-edition-readiness.mjs). The plan job is
# lightweight (no browser except the one unavoidable live K-market scrape, no
# X call, no successful receipt write) and hands each poster job one frozen,
# validated plan. Duplicate protection is layered: this workflow's four
# concurrency groups serialize same-edition runs across separate runners
# (which do not share a filesystem), the in-process publication lease guards
# the exact publish sequence, and the git-backed receipt on
# automation/mlb-x-state is re-read under that lease and remains authoritative
# after any queued run resumes.
#
# A fifth, independent publication target -- post-daily-card-morning -- posts
# one combined home-run/strikeout model card instead of k-morning and
# hr-morning, whenever the repository variable MLB_DAILY_CARD_MORNING_LIVE is
# exactly "true". For 'morning-live' dispatches and scheduled/workflow_run
# firings, it is mutually exclusive with those two jobs by construction (each
# gate is the other's negation on that same flag) -- it has its own
# concurrency group, its own lease, and its own structurally distinct receipt
# namespace (mlb-x/<slate-date>/receipts/daily-card-morning.json), and never
# touches the confirmed editions or their receipts. The one deliberate
# exception is workflow_dispatch mode 'morning-dry-run': that mode always
# runs post-daily-card-morning (so the composite path can be tested without
# flipping the flag) and always skips post-k-morning/post-hr-morning, a
# routing decision independent of the flag's current value -- it is still a
# genuine dry run with no X call and no successful receipt, exactly like
# every other dry-run mode in this file.
on:
  schedule:
    # Morning edition: seven candidate firings (EDT+EST) meant to land inside
    # 09:45-11:15 ET. The America/New_York-based readiness module is the sole
    # authority on whether a given firing is actually inside the window, so
    # an out-of-season candidate is a routine NOT_DUE/MISSED_WINDOW, not a
    # bug. On 2026-07-27 GitHub delivered ZERO of these firings inside
    # 09:45-11:15 ET at all -- the first one that day landed at 11:22 ET --
    # so resolveEditionReadiness now also opens a catch-up stage through
    # 13:00 ET (see MORNING_CATCH_UP_CLOSE_ET in mlb-x-edition-readiness.mjs)
    # rather than treating a late GHA delivery as a full-day loss.
    - cron: "45 13 * * *"  # 09:45 EDT
    - cron: "45 14 * * *"  # 10:45 EDT / 09:45 EST
    - cron: "15 14 * * *"  # 10:15 EDT
    - cron: "15 15 * * *"  # 10:15 EST
    - cron: "45 15 * * *"  # 10:45 EST
    - cron: "10 15 * * *"  # 11:10 EDT
    - cron: "10 16 * * *"  # 11:10 EST
    # Confirmed/pregame edition: every 20 minutes across the likely MLB
    # pregame period (roughly noon-1:30 AM ET across the season and both
    # offsets). resolveEditionReadiness's minutes-before-first-pitch window
    # (2h20m-1h15m) decides eligibility on every firing; most firings outside
    # a slate's actual pregame window are a routine NOT_DUE.
    - cron: "*/20 16-23,0-5 * * *"
  workflow_run:
    # Fires after the canonical data-generation workflow succeeds on main.
    # Still obeys every edition window, receipt, image and live-post check --
    # this is an additional opportunity to catch an eligible window promptly
    # after fresh data lands, never a bypass of any of them.
    workflows: ["Generate MLB Data"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "morning-dry-run"
        type: choice
        options:
          - morning-dry-run
          - confirmed-dry-run
          - morning-live
          - confirmed-live
          - diagnostic-only
      simulation_now:
        description: >-
          Dry-run-only simulated clock, format YYYY-MM-DDTHH:mm:ssZ. Only
          accepted for morning-dry-run, confirmed-dry-run or diagnostic-only,
          and only when it names the same Eastern slate date the planner
          resolves for real -- resolveEventMode (mlb-x-event-mode.mjs)
          rejects it as CONFIGURATION_ERROR otherwise, including for
          morning-live/confirmed-live. Never used for a live post; leave
          blank to use the real clock.
        required: false
        type: string

# Deliberately no workflow-wide concurrency group: the four editions must be
# able to run independently. Each poster job below sets its own.
permissions:
  contents: read

env:
  X_EXPECTED_USERNAME: _joeknowsball_
  MLB_X_STATE_BRANCH: automation/mlb-x-state

jobs:
  plan:
    # Fetches automation/mlb-x-state and now also pushes to it, but only ever
    # a diagnostic (mlb-x/{date}/diagnostics/{market}-{edition}.json) for a
    # planner-decided non-post status (NOT_DUE, MISSED_WINDOW,
    # WAITING_FOR_SELECTED_LINEUPS, NO_VALID_PICKS, INVALID_SLATE) -- statuses
    # for which the corresponding poster job never launches (see the
    # per-edition `if:` below), so the planner is the only place they can ever
    # be recorded. It never calls writeReceipt; contents: write is scoped to
    # that diagnostics-only write path, not to publication.
    permissions:
      contents: write
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      slate_date: ${{ steps.plan.outputs.slate_date }}
      first_game_time: ${{ steps.plan.outputs.first_game_time }}
      k_morning_should_run: ${{ steps.plan.outputs.k_morning_should_run }}
      hr_morning_should_run: ${{ steps.plan.outputs.hr_morning_should_run }}
      k_confirmed_should_run: ${{ steps.plan.outputs.k_confirmed_should_run }}
      hr_confirmed_should_run: ${{ steps.plan.outputs.hr_confirmed_should_run }}
      k_morning_status: ${{ steps.plan.outputs.k_morning_status }}
      hr_morning_status: ${{ steps.plan.outputs.hr_morning_status }}
      k_confirmed_status: ${{ steps.plan.outputs.k_confirmed_status }}
      hr_confirmed_status: ${{ steps.plan.outputs.hr_confirmed_status }}
      # Distinguishes e.g. a morning post made during the ordinary 09:45-11:15
      # ET window (stage=morning) from one recovered after a missed scheduled
      # firing (stage=morning_catch_up) -- see mlb-x-edition-readiness.mjs.
      k_morning_stage: ${{ steps.plan.outputs.k_morning_stage }}
      hr_morning_stage: ${{ steps.plan.outputs.hr_morning_stage }}
      k_confirmed_stage: ${{ steps.plan.outputs.k_confirmed_stage }}
      hr_confirmed_stage: ${{ steps.plan.outputs.hr_confirmed_stage }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright (K market-data scrape only)
        run: npx playwright install --with-deps chromium

      - name: Build four edition plans
        id: plan
        run: |
          MODE="${{ github.event.inputs.mode || '' }}"
          LIVE_FLAG=""
          if [ "$MODE" = "morning-live" ] || [ "$MODE" = "confirmed-live" ]; then LIVE_FLAG="--live-mode"; fi
          node scripts/plan-mlb-x-editions.mjs \
            --plan-directory=artifacts/mlb-x-plans \
            --image-directory=artifacts/mlb-x-images \
            --state-work-dir=.mlb-x-state-work \
            --hr-data-source=production \
            $LIVE_FLAG
        env:
          # The state-work directory is a SEPARATE git clone from the
          # checked-out repo, so it does not inherit actions/checkout's
          # credential config -- a plain https URL here has no push (or, on
          # a private repo, even read) access. github.token is masked in
          # logs the same as any secret; never echo this URL.
          MLB_X_STATE_REMOTE_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
          # Forwarded so the planner's own resolveEventMode call can decide
          # whether simulation_now applies to its readiness preview -- the
          # planner never uses it for slate-date resolution, only window
          # timing, and silently falls back to the real clock if rejected.
          MLB_X_DISPATCH_MODE: ${{ github.event.inputs.mode }}
          MLB_X_SIMULATION_NOW: ${{ github.event.inputs.simulation_now }}
          # Read (never hardcoded) so the FROZEN plan's own readiness/
          # diagnostic correctly reflects whether live posting is actually
          # allowed -- resolveEditionReadiness genuinely consumes this value.
          # Unset (the default) is fail-closed, the same as the poster jobs.
          X_ALLOW_LIVE_POST: ${{ vars.X_ALLOW_LIVE_POST }}
          JKB_X_API_KEY: ${{ secrets.JKB_X_API_KEY }}
          JKB_X_API_SECRET: ${{ secrets.JKB_X_API_SECRET }}
          JKB_X_ACCESS_TOKEN: ${{ secrets.JKB_X_ACCESS_TOKEN }}
          JKB_X_ACCESS_SECRET: ${{ secrets.JKB_X_ACCESS_SECRET }}

      - name: Upload frozen plans
        uses: actions/upload-artifact@v4
        with:
          name: mlb-x-plans-${{ github.run_id }}
          path: artifacts/mlb-x-plans
          if-no-files-found: error
          retention-days: 1

      - name: Summary
        if: always()
        run: |
          echo "## MLB X plan — ${{ steps.plan.outputs.slate_date }}" >> "$GITHUB_STEP_SUMMARY"
          echo "first pitch: ${{ steps.plan.outputs.first_game_time || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | Should run | Status | Stage |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| K morning | ${{ steps.plan.outputs.k_morning_should_run }} | ${{ steps.plan.outputs.k_morning_status }} | ${{ steps.plan.outputs.k_morning_stage }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| HR morning | ${{ steps.plan.outputs.hr_morning_should_run }} | ${{ steps.plan.outputs.hr_morning_status }} | ${{ steps.plan.outputs.hr_morning_stage }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| K confirmed | ${{ steps.plan.outputs.k_confirmed_should_run }} | ${{ steps.plan.outputs.k_confirmed_status }} | ${{ steps.plan.outputs.k_confirmed_stage }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| HR confirmed | ${{ steps.plan.outputs.hr_confirmed_should_run }} | ${{ steps.plan.outputs.hr_confirmed_status }} | ${{ steps.plan.outputs.hr_confirmed_stage }} |" >> "$GITHUB_STEP_SUMMARY"

  post-k-morning:
    needs: plan
    # 'morning-dry-run' is reserved for manually testing the composite daily
    # card (post-daily-card-morning below) without needing to flip
    # MLB_DAILY_CARD_MORNING_LIVE first -- this job always sits out that
    # specific dispatch mode. Outside of that mode, this job is disabled
    # whenever the flag is enabled ('true'), so scheduled/workflow_run firings
    # and 'morning-live' dispatches never post both the legacy and composite
    # morning cards for the same run: this job requires the flag NOT be
    # 'true'; post-daily-card-morning requires the opposite for those same
    # two triggers.
    if: |
      github.event.inputs.mode != 'morning-dry-run' &&
      vars.MLB_DAILY_CARD_MORNING_LIVE != 'true' &&
      (
        github.event.inputs.mode == 'morning-live' ||
        (github.event.inputs.mode == '' && needs.plan.outputs.k_morning_should_run == 'true')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: mlb-x-k-morning
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: mlb-x-plans-${{ github.run_id }}
          path: artifacts/mlb-x-plans
        # A queued run that resumes after a same-edition run already completed
        # downloads the SAME plan job's artifact -- runEditionPost re-syncs and
        # re-reads the receipt under its own lease regardless, so a stale plan
        # here still cannot cause a duplicate post; it can only cause a
        # (harmless) ALREADY_POSTED.

      - name: Post K morning
        run: |
          node scripts/post-mlb-x-edition.mjs \
            --market=k --edition=morning \
            --slate-date="${{ needs.plan.outputs.slate_date }}" \
            --plan-directory=artifacts/mlb-x-plans \
            --image-directory=artifacts/mlb-x-images \
            --lease-directory=artifacts/mlb-x-leases \
            --state-work-dir=.mlb-x-state-work
        env:
          # The state-work directory is a SEPARATE git clone from the
          # checked-out repo, so it does not inherit actions/checkout's
          # credential config -- a plain https URL here has no push (or, on
          # a private repo, even read) access. github.token is masked in
          # logs the same as any secret; never echo this URL.
          MLB_X_STATE_REMOTE_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          # workflow_dispatch's chosen mode -- empty for schedule/workflow_run.
          # resolveEventMode (mlb-x-event-mode.mjs) is the sole authority on
          # dry-run vs. live-capable; nothing here computes that decision.
          MLB_X_DISPATCH_MODE: ${{ github.event.inputs.mode }}
          MLB_X_SIMULATION_NOW: ${{ github.event.inputs.simulation_now }}
          # Independent kill switch: a repository variable a human sets
          # explicitly, separate from any code change or merge. Unset (the
          # default) fails closed -- assertLivePostAllowed requires exactly
          # "true" -- even on a live-capable event/mode.
          X_ALLOW_LIVE_POST: ${{ vars.X_ALLOW_LIVE_POST }}
          JKB_X_API_KEY: ${{ secrets.JKB_X_API_KEY }}
          JKB_X_API_SECRET: ${{ secrets.JKB_X_API_SECRET }}
          JKB_X_ACCESS_TOKEN: ${{ secrets.JKB_X_ACCESS_TOKEN }}
          JKB_X_ACCESS_SECRET: ${{ secrets.JKB_X_ACCESS_SECRET }}

  post-hr-morning:
    needs: plan
    # Same rationale and same shape as post-k-morning above: always sits out
    # 'morning-dry-run' (reserved for testing the composite card), and
    # otherwise disabled whenever MLB_DAILY_CARD_MORNING_LIVE == 'true'.
    if: |
      github.event.inputs.mode != 'morning-dry-run' &&
      vars.MLB_DAILY_CARD_MORNING_LIVE != 'true' &&
      (
        github.event.inputs.mode == 'morning-live' ||
        (github.event.inputs.mode == '' && needs.plan.outputs.hr_morning_should_run == 'true')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: mlb-x-hr-morning
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: mlb-x-plans-${{ github.run_id }}
          path: artifacts/mlb-x-plans

      - name: Post HR morning
        run: |
          node scripts/post-mlb-x-edition.mjs \
            --market=hr --edition=morning \
            --slate-date="${{ needs.plan.outputs.slate_date }}" \
            --plan-directory=artifacts/mlb-x-plans \
            --image-directory=artifacts/mlb-x-images \
            --lease-directory=artifacts/mlb-x-leases \
            --state-work-dir=.mlb-x-state-work
        env:
          # The state-work directory is a SEPARATE git clone from the
          # checked-out repo, so it does not inherit actions/checkout's
          # credential config -- a plain https URL here has no push (or, on
          # a private repo, even read) access. github.token is masked in
          # logs the same as any secret; never echo this URL.
          MLB_X_STATE_REMOTE_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          MLB_X_DISPATCH_MODE: ${{ github.event.inputs.mode }}
          MLB_X_SIMULATION_NOW: ${{ github.event.inputs.simulation_now }}
          X_ALLOW_LIVE_POST: ${{ vars.X_ALLOW_LIVE_POST }}
          JKB_X_API_KEY: ${{ secrets.JKB_X_API_KEY }}
          JKB_X_API_SECRET: ${{ secrets.JKB_X_API_SECRET }}
          JKB_X_ACCESS_TOKEN: ${{ secrets.JKB_X_ACCESS_TOKEN }}
          JKB_X_ACCESS_SECRET: ${{ secrets.JKB_X_ACCESS_SECRET }}

  # Combined morning daily-card post: one X post carrying both the top home
  # run targets and the projected strikeout leaders, replacing post-k-morning
  # and post-hr-morning for the morning slot whenever
  # MLB_DAILY_CARD_MORNING_LIVE == 'true'. Reuses the SAME morning timing
  # signal the legacy jobs use (k_morning_should_run / hr_morning_should_run
  # from `plan`) rather than computing its own -- this is not a new selection
  # or readiness decision, only a routing switch for which job posts.
  # Independent concurrency group, independent lease, independent
  # (structurally distinct) receipt namespace -- see mlb-x-state-store.mjs's
  # dailyCardReceiptPathFor and mlb-x-daily-card-publication.mjs.
  #
  # 'morning-dry-run' is always eligible regardless of the flag -- this is
  # the one deliberate escape hatch, so the composite path (generation,
  # validation, caption) can be manually tested end to end before the flag is
  # ever flipped in production. It is still a genuine dry run: MLB_X_DISPATCH_
  # MODE=morning-dry-run resolves dryRun=true in resolveEventMode regardless
  # of this workflow's `if:`, so post-mlb-x-daily-card.mjs still never calls X
  # and never writes a successful receipt for this mode -- see
  # mlb-x-event-mode.mjs and mlb-x-daily-card-poster.mjs, neither of which
  # this fix touches. 'morning-live' is NOT given this escape hatch: it still
  # requires the flag, so a live-capable dispatch can never bypass it. See the
  # inverse gate on post-k-morning/post-hr-morning above -- for every trigger
  # this job shares with them ('morning-live' and the '' schedule/
  # workflow_run case), the two sides are exact complements of the same flag
  # check, so they can never both be eligible in the same run.
  post-daily-card-morning:
    needs: plan
    if: |
      github.event.inputs.mode == 'morning-dry-run' ||
      (
        vars.MLB_DAILY_CARD_MORNING_LIVE == 'true' &&
        (
          github.event.inputs.mode == 'morning-live' ||
          (github.event.inputs.mode == '' && (needs.plan.outputs.k_morning_should_run == 'true' || needs.plan.outputs.hr_morning_should_run == 'true'))
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: mlb-x-daily-card-morning
      cancel-in-progress: false
    steps:
      # Explicit ref, same rationale as generate-daily-card-morning above:
      # the exact commit checked out is never in doubt, and this is never the
      # implicit workflow_run/dispatch default.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Unmodified live CLI, no --preview. Deliberately NOT continue-on-error:
      # this job posts nothing else, so a generation failure or a genuinely
      # blocked slate (e.g. zero VALID projected-K rows) must fail this step
      # and skip "Post daily card morning" below outright -- never a preview
      # card, never a fixture fallback, never a post from a blocked
      # generation.
      - name: Generate morning daily card
        shell: bash
        run: |
          npx tsx scripts/generate-social-card-live.ts \
            --edition=morning \
            --slate-date="${{ needs.plan.outputs.slate_date }}" \
            > card-morning-post-stdout.log 2> card-morning-post-stderr.log
          cat card-morning-post-stdout.log
          cat card-morning-post-stderr.log >&2

      - name: Post daily card morning
        run: |
          node scripts/post-mlb-x-daily-card.mjs \
            --edition=morning \
            --slate-date="${{ needs.plan.outputs.slate_date }}" \
            --card-result-file=card-morning-post-stdout.log \
            --lease-directory=artifacts/mlb-x-leases \
            --state-work-dir=.mlb-x-state-work-daily-card
        env:
          # Same separate-clone rationale as every other poster job's
          # MLB_X_STATE_REMOTE_URL -- never echo this URL.
          MLB_X_STATE_REMOTE_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          MLB_X_DISPATCH_MODE: ${{ github.event.inputs.mode }}
          MLB_X_SIMULATION_NOW: ${{ github.event.inputs.simulation_now }}
          X_ALLOW_LIVE_POST: ${{ vars.X_ALLOW_LIVE_POST }}
          JKB_X_API_KEY: ${{ secrets.JKB_X_API_KEY }}
          JKB_X_API_SECRET: ${{ secrets.JKB_X_API_SECRET }}
          JKB_X_ACCESS_TOKEN: ${{ secrets.JKB_X_ACCESS_TOKEN }}
          JKB_X_ACCESS_SECRET: ${{ secrets.JKB_X_ACCESS_SECRET }}

  post-k-confirmed:
    needs: plan
    if: |
      github.event.inputs.mode == 'confirmed-dry-run' || github.event.inputs.mode == 'confirmed-live' ||
      (github.event.inputs.mode == '' && needs.plan.outputs.k_confirmed_should_run == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: mlb-x-k-confirmed
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: mlb-x-plans-${{ github.run_id }}
          path: artifacts/mlb-x-plans

      - name: Post K confirmed
        run: |
          node scripts/post-mlb-x-edition.mjs \
            --market=k --edition=confirmed \
            --slate-date="${{ needs.plan.outputs.slate_date }}" \
            --plan-directory=artifacts/mlb-x-plans \
            --image-directory=artifacts/mlb-x-images \
            --lease-directory=artifacts/mlb-x-leases \
            --state-work-dir=.mlb-x-state-work
        env:
          # The state-work directory is a SEPARATE git clone from the
          # checked-out repo, so it does not inherit actions/checkout's
          # credential config -- a plain https URL here has no push (or, on
          # a private repo, even read) access. github.token is masked in
          # logs the same as any secret; never echo this URL.
          MLB_X_STATE_REMOTE_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          MLB_X_DISPATCH_MODE: ${{ github.event.inputs.mode }}
          MLB_X_SIMULATION_NOW: ${{ github.event.inputs.simulation_now }}
          X_ALLOW_LIVE_POST: ${{ vars.X_ALLOW_LIVE_POST }}
          JKB_X_API_KEY: ${{ secrets.JKB_X_API_KEY }}
          JKB_X_API_SECRET: ${{ secrets.JKB_X_API_SECRET }}
          JKB_X_ACCESS_TOKEN: ${{ secrets.JKB_X_ACCESS_TOKEN }}
          JKB_X_ACCESS_SECRET: ${{ secrets.JKB_X_ACCESS_SECRET }}

  post-hr-confirmed:
    needs: plan
    if: |
      github.event.inputs.mode == 'confirmed-dry-run' || github.event.inputs.mode == 'confirmed-live' ||
      (github.event.inputs.mode == '' && needs.plan.outputs.hr_confirmed_should_run == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: mlb-x-hr-confirmed
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: mlb-x-plans-${{ github.run_id }}
          path: artifacts/mlb-x-plans

      - name: Post HR confirmed
        run: |
          node scripts/post-mlb-x-edition.mjs \
            --market=hr --edition=confirmed \
            --slate-date="${{ needs.plan.outputs.slate_date }}" \
            --plan-directory=artifacts/mlb-x-plans \
            --image-directory=artifacts/mlb-x-images \
            --lease-directory=artifacts/mlb-x-leases \
            --state-work-dir=.mlb-x-state-work
        env:
          # The state-work directory is a SEPARATE git clone from the
          # checked-out repo, so it does not inherit actions/checkout's
          # credential config -- a plain https URL here has no push (or, on
          # a private repo, even read) access. github.token is masked in
          # logs the same as any secret; never echo this URL.
          MLB_X_STATE_REMOTE_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          MLB_X_DISPATCH_MODE: ${{ github.event.inputs.mode }}
          MLB_X_SIMULATION_NOW: ${{ github.event.inputs.simulation_now }}
          X_ALLOW_LIVE_POST: ${{ vars.X_ALLOW_LIVE_POST }}
          JKB_X_API_KEY: ${{ secrets.JKB_X_API_KEY }}
          JKB_X_API_SECRET: ${{ secrets.JKB_X_API_SECRET }}
          JKB_X_ACCESS_TOKEN: ${{ secrets.JKB_X_ACCESS_TOKEN }}
          JKB_X_ACCESS_SECRET: ${{ secrets.JKB_X_ACCESS_SECRET }}

  # Phase 2: daily model card generation (artifacts only -- no website change,
  # no X post, no publication of any kind). Uses the existing live CLI
  # (scripts/generate-social-card-live.ts) unmodified; this job only resolves
  # the slate date from `plan`'s own output (never the runner's UTC clock),
  # runs the CLI, and uploads whatever it produced. A card-generation failure
  # is isolated at the step level (continue-on-error + captured exit code) so
  # it can never affect `plan`'s outputs or any X-posting job below, none of
  # which depend on this job.
  generate-daily-card-morning:
    needs: plan
    if: |
      needs.plan.result == 'success' &&
      (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        github.event.inputs.mode == 'morning-dry-run' ||
        github.event.inputs.mode == 'morning-live'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Explicit ref (not the implicit workflow_run/dispatch default) so the
      # exact commit checked out is never in doubt: main's current tip,
      # which by construction already includes the hr-props-raw.json commit
      # the upstream "Generate MLB Data" workflow just pushed -- that push is
      # the last action in its job, so it has landed before that workflow
      # reports "completed" and this job's `if` above allows it to start.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Generate morning daily card
        id: generate_card
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx tsx scripts/generate-social-card-live.ts \
            --edition=morning \
            --slate-date="${{ needs.plan.outputs.slate_date }}" \
            > card-morning-stdout.log 2> card-morning-stderr.log
          exit_code=$?
          set -e
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          cat card-morning-stdout.log
          cat card-morning-stderr.log >&2

      - name: Report morning card generation summary
        if: always()
        shell: bash
        run: |
          node scripts/report-social-card-generation.mjs \
            --edition=morning \
            --slate-date="${{ needs.plan.outputs.slate_date }}" \
            --source-path=public/data/mlb/hr-props-raw.json \
            --exit-code="${{ steps.generate_card.outputs.exit_code || '1' }}" \
            --stdout-file=card-morning-stdout.log \
            --stderr-file=card-morning-stderr.log \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload morning card artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-daily-card-morning-${{ needs.plan.outputs.slate_date }}
          path: |
            artifacts/social-cards/mlb/${{ needs.plan.outputs.slate_date }}/
            card-morning-stdout.log
            card-morning-stderr.log
          if-no-files-found: warn
          retention-days: 14

  # Attempts a full (publish-ready) confirmed card first; confirmed K/values
  # selection has no trustworthy source yet (see docs/social-cards.md), so
  # this is currently expected to fall back to the explicit --preview path on
  # every run, which the CLI itself never treats as a failure. Both attempts
  # are step-isolated the same way as the morning job above.
  generate-daily-card-confirmed:
    needs: plan
    if: |
      needs.plan.result == 'success' &&
      (
        github.event.inputs.mode == 'confirmed-dry-run' || github.event.inputs.mode == 'confirmed-live' ||
        (github.event.inputs.mode == '' && (needs.plan.outputs.hr_confirmed_should_run == 'true' || needs.plan.outputs.k_confirmed_should_run == 'true'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Same explicit-ref rationale as generate-daily-card-morning above.
      # This job also fires on the schedule trigger (the 20-minute pregame
      # cron), where main's current tip is unambiguously correct with no
      # workflow_run-specific reasoning needed at all.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Generate confirmed daily card (full attempt)
        id: generate_card_full
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx tsx scripts/generate-social-card-live.ts \
            --edition=confirmed \
            --slate-date="${{ needs.plan.outputs.slate_date }}" \
            > card-confirmed-stdout.log 2> card-confirmed-stderr.log
          exit_code=$?
          set -e
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"

      - name: Generate confirmed daily card (preview fallback)
        id: generate_card_preview
        if: steps.generate_card_full.outputs.exit_code != '0'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx tsx scripts/generate-social-card-live.ts \
            --edition=confirmed \
            --slate-date="${{ needs.plan.outputs.slate_date }}" \
            --preview \
            > card-confirmed-stdout.log 2> card-confirmed-stderr.log
          exit_code=$?
          set -e
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          cat card-confirmed-stdout.log
          cat card-confirmed-stderr.log >&2

      - name: Report confirmed card generation summary
        if: always()
        shell: bash
        run: |
          FINAL_EXIT="${{ steps.generate_card_preview.outputs.exit_code || steps.generate_card_full.outputs.exit_code || '1' }}"
          node scripts/report-social-card-generation.mjs \
            --edition=confirmed \
            --slate-date="${{ needs.plan.outputs.slate_date }}" \
            --source-path=public/data/mlb/hr-props-raw.json \
            --exit-code="${FINAL_EXIT}" \
            --stdout-file=card-confirmed-stdout.log \
            --stderr-file=card-confirmed-stderr.log \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload confirmed card artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-daily-card-confirmed-${{ needs.plan.outputs.slate_date }}
          path: |
            artifacts/social-cards/mlb/${{ needs.plan.outputs.slate_date }}/
            card-confirmed-stdout.log
            card-confirmed-stderr.log
          if-no-files-found: warn
          retention-days: 14

  diagnostic:
    needs: plan
    if: github.event.inputs.mode == 'diagnostic-only'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: mlb-x-plans-${{ github.run_id }}
          path: artifacts/mlb-x-plans
      - name: Diagnostic check, all four targets
        run: |
          for target in "k morning" "hr morning" "k confirmed" "hr confirmed"; do
            set -- $target
            node scripts/post-mlb-x-edition.mjs --market="$1" --edition="$2" \
              --slate-date="${{ needs.plan.outputs.slate_date }}" \
              --plan-directory=artifacts/mlb-x-plans --diagnostic-only
          done
        env:
          MLB_X_DISPATCH_MODE: ${{ github.event.inputs.mode }}
          MLB_X_SIMULATION_NOW: ${{ github.event.inputs.simulation_now }}
          JKB_X_API_KEY: ${{ secrets.JKB_X_API_KEY }}
          JKB_X_API_SECRET: ${{ secrets.JKB_X_API_SECRET }}
          JKB_X_ACCESS_TOKEN: ${{ secrets.JKB_X_ACCESS_TOKEN }}
          JKB_X_ACCESS_SECRET: ${{ secrets.JKB_X_ACCESS_SECRET }}

  audit:
    needs: [plan, post-k-morning, post-hr-morning, post-k-confirmed, post-hr-confirmed]
    if: always() && needs.plan.result == 'success' && github.event.inputs.mode != 'diagnostic-only'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Audit all four editions
        run: |
          node scripts/audit-mlb-x-editions.mjs \
            --slate-date="${{ needs.plan.outputs.slate_date }}" \
            --first-game-time="${{ needs.plan.outputs.first_game_time }}" \
            --state-work-dir=.mlb-x-state-work-audit \
            --plan-directory=artifacts/mlb-x-plans
        env:
          # The state-work directory is a SEPARATE git clone from the
          # checked-out repo, so it does not inherit actions/checkout's
          # credential config -- a plain https URL here has no push (or, on
          # a private repo, even read) access. github.token is masked in
          # logs the same as any secret; never echo this URL.
          MLB_X_STATE_REMOTE_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}

  # Twice daily, well after the morning and confirmed windows have had a
  # chance to close, so the audit reflects a settled slate rather than a
  # still-open window.
  audit-eod:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Resolve today's ET slate date
        id: et_date
        run: echo "date=$(TZ=America/New_York date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Audit all four editions (end of day)
        run: |
          node scripts/audit-mlb-x-editions.mjs \
            --slate-date="${{ steps.et_date.outputs.date }}" \
            --state-work-dir=.mlb-x-state-work-audit-eod
        env:
          # The state-work directory is a SEPARATE git clone from the
          # checked-out repo, so it does not inherit actions/checkout's
          # credential config -- a plain https URL here has no push (or, on
          # a private repo, even read) access. github.token is masked in
          # logs the same as any secret; never echo this URL.
          MLB_X_STATE_REMOTE_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
