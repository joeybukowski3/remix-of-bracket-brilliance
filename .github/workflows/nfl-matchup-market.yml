name: NFL Matchup Market

run-name: NFL Matchup Market • ${{ github.event_name }} • ${{ github.ref_name }}

on:
  schedule:
    # 6:40 AM ET daily during the NFL season window (Sep-Feb) — shortly after
    # the 6:10 AM schedules/results refresh. nflverse's games.csv spread_line
    # column is populated progressively as sportsbooks price upcoming games
    # (confirmed: only ~40% of a season's games carry a line this far ahead
    # of kickoff), not published once and left static, so a daily refresh is
    # meaningful rather than manufactured freshness over an unchanged value.
    - cron: "40 6 * 1,2,9,10,11,12 *"
      timezone: "America/New_York"
  workflow_dispatch:

# Share one lock with the other automated workflows that commit generated data to main.
concurrency:
  group: main-data-writers-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-matchup-market:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate NFL matchup market artifact
        run: npm run nfl:matchup-market

      - name: Detect meaningful data changes
        id: changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- 'public/data/nfl/matchup-market.json')" ]; then
            echo "No NFL matchup market changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "NFL matchup market changes detected."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate generated JSON
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          node -e "
            const { readFileSync } = require('fs');
            const file = 'public/data/nfl/matchup-market.json';
            const parsed = JSON.parse(readFileSync(file, 'utf8'));
            if (parsed.schemaVersion !== 'nfl-matchup-market-v1') {
              throw new Error(\`\${file} has unexpected schemaVersion \${parsed.schemaVersion}\`);
            }
            if (!parsed.currentMarket || Object.keys(parsed.currentMarket).length === 0) {
              throw new Error(\`\${file} has no current-market rows\`);
            }
            console.log('Generated NFL matchup market artifact is valid.');
          "

      - name: Commit and push refreshed data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/nfl/matchup-market.json

          if git diff --cached --quiet; then
            echo "No staged NFL matchup market changes."
            exit 0
          fi

          git commit -m "data(nfl): refresh matchup market"

          pushed=false
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase failed on attempt ${attempt}; aborting before retry." >&2
              git rebase --abort || true
            elif git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep $((attempt * 10))
          done

          if [ "$pushed" != "true" ]; then
            echo "ERROR: All push attempts failed — NFL matchup market was not committed." >&2
            exit 1
          fi

          echo "NFL matchup market pushed successfully."
