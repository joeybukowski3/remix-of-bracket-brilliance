name: NFL Matchup Projections

run-name: NFL Matchup Projections • ${{ github.event_name }} • ${{ github.ref_name }}

on:
  schedule:
    # 8:10 AM ET daily during the NFL season window (Sep-Feb) — after the
    # 6:10 AM schedules/results refresh, the 7:40 AM team-ratings refresh and
    # the 7:55 AM performance-analytics refresh have all landed, so the
    # canonical Current OVR board this generator reads is already current
    # for the day.
    - cron: "10 8 * 1,2,9,10,11,12 *"
      timezone: "America/New_York"
  workflow_dispatch:

# Share one lock with the other automated workflows that commit generated data to main.
concurrency:
  group: main-data-writers-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-matchup-projections:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Reuses the canonical Current OVR board (src/lib/nfl/currentRating2026.ts)
      # and Power Number module (src/lib/nfl/jkbPowerNumber2026.ts) directly —
      # this script contains no rating math of its own.
      - name: Generate NFL matchup projections
        run: npm run nfl:matchup-projections

      - name: Detect meaningful data changes
        id: changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- 'public/data/nfl/matchup-projections.json')" ]; then
            echo "No NFL matchup projection changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "NFL matchup projection changes detected."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate generated JSON
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          node -e "
            const { readFileSync } = require('fs');
            const file = 'public/data/nfl/matchup-projections.json';
            const parsed = JSON.parse(readFileSync(file, 'utf8'));
            if (parsed.schemaVersion !== 'nfl-matchup-projections-v2') {
              throw new Error(\`\${file} has unexpected schemaVersion \${parsed.schemaVersion}\`);
            }
            if (parsed.model.marketInputUsed !== false) {
              throw new Error(\`\${file} model.marketInputUsed must be false\`);
            }
            if (!parsed.projections || Object.keys(parsed.projections).length === 0) {
              throw new Error(\`\${file} has no projected games\`);
            }
            console.log('Generated NFL matchup projections artifact is valid.');
          "

      - name: Commit and push refreshed data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/nfl/matchup-projections.json

          if git diff --cached --quiet; then
            echo "No staged NFL matchup projection changes."
            exit 0
          fi

          git commit -m "data(nfl): refresh matchup projections"

          pushed=false
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase failed on attempt ${attempt}; aborting before retry." >&2
              git rebase --abort || true
            elif git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep $((attempt * 10))
          done

          if [ "$pushed" != "true" ]; then
            echo "ERROR: All push attempts failed — NFL matchup projections were not committed." >&2
            exit 1
          fi

          echo "NFL matchup projections pushed successfully."
