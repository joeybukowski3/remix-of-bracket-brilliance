name: NFL Schedules and Results

run-name: NFL Schedules and Results • ${{ github.event_name }} • ${{ github.ref_name }}

on:
  schedule:
    # 6:10 AM ET daily during the NFL season window (Sep-Feb) — after the
    # previous night's games (SNF/MNF/playoffs) are final in nflverse.
    - cron: "10 6 * 1,2,9,10,11,12 *"
      timezone: "America/New_York"
  workflow_dispatch:

# Share one lock with the other automated workflows that commit generated data to main.
concurrency:
  group: main-data-writers-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-schedules-results:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate NFL schedules and results
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "NFL schedules attempt ${attempt}/3"
            if npm run nfl:schedules; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "NFL schedules generation failed after 3 attempts." >&2
          exit 1

      - name: Refresh authoritative 2026 player-week stats
        id: player-stats
        continue-on-error: true
        shell: bash
        run: |
          npm run nfl:player-week-stats-cache -- \
            --seasons=2026 \
            --partial-season=2026

      # WU4C.1: team_opportunity resolution needs the same play-volume-team-game
      # cache WU4A trains against (see nfl-prediction-outcome-resolver.ts).
      # continue-on-error, same as the player-stats step above -- a failure
      # here must never block spread/player resolution; it only leaves
      # team_opportunity predictions "pending_team_stats" until it next
      # succeeds (Part 10: team-level grading is never gated on player data,
      # but it IS gated on this cache, which is its own, non-player, source).
      - name: Refresh 2026 play-volume-team-game cache
        id: play-volume
        continue-on-error: true
        shell: bash
        run: npm run nfl:play-volume-cache -- --seasons=2026

      - name: Resolve archived 2026 production predictions
        shell: bash
        run: |
          resolver_args=(--season=2026)
          if [ "${{ steps.player-stats.outcome }}" != "success" ]; then
            echo "::warning::Player-week refresh failed; resolving spreads and team_opportunity only and leaving player predictions pending."
            resolver_args+=(--prediction-types=spread,team_opportunity)
          fi
          if [ "${{ steps.play-volume.outcome }}" != "success" ]; then
            echo "::warning::Play-volume cache refresh failed; team_opportunity predictions will resolve as pending_team_stats this run."
          fi
          npm run resolve:nfl-prediction-outcomes -- "${resolver_args[@]}"

      # WU4C.1 Part 13: resolver counts (resolved/pending by type) are already
      # printed by resolve-nfl-prediction-outcomes.ts's own JSON log line
      # above -- this just labels it clearly for a scan of the job log.
      - name: Log resolution summary
        shell: bash
        run: echo "[nfl:resolve-outcomes] see the JSON summary logged by the previous step for resolved/pending counts by prediction_type."

      # WU4C.1 Part 11: WU3 materialization, wired directly after resolution.
      # Derived-only (reads WU1 predictions + WU2 outcomes, never mutates
      # either), deterministic (byte-identical on an unchanged rerun), and
      # atomic (nfl-evaluation-materializer.ts writes via temp-file+rename).
      # continue-on-error: a materializer bug must never block the far more
      # load-bearing games/results/outcome commit above it in this same job.
      - name: Materialize WU3 evaluations
        id: materialize
        continue-on-error: true
        shell: bash
        run: npm run materialize:nfl-evaluation -- --season=2026

      # WU4G: cumulative rushing shadow-vs-production / receiving
      # role-conflict forward evaluation. Reads ONLY the WU3 files this same
      # job just wrote above -- never the WU1/WU2 archives directly -- so it
      # is gated on the WU3 step actually having succeeded this run.
      # continue-on-error: same rationale as WU3 above -- a bug here must
      # never block the far more load-bearing commit below it.
      - name: Materialize WU4G forward evaluation
        id: forward-evaluate
        if: steps.materialize.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: npm run materialize:nfl-forward-evaluation -- --season=2026

      # WU4 -- regrade every week that already has a frozen pregame starter
      # cohort (data/nfl/starter-cohorts/2026/*.jsonl), not just the
      # currently-resolving week. This is deliberate: the day the season's
      # last game of a week goes final is the SAME day that week stops being
      # "current" for other workflows' current-week resolution, so a
      # current-week-only loop here would flip away from a week the instant
      # it most needs (re)grading. The generator is idempotent and safe to
      # rerun after a stat correction (see generate-nfl-starter-prop-
      # evaluations.mts's docblock), so regrading every existing week on
      # every run is cheap and simply reflects the latest outcome archive.
      # continue-on-error, same rationale as WU3/WU4G above -- a bug here
      # must never block the far more load-bearing commit below it.
      - name: Materialize WU4 starter-prop evaluations (every frozen cohort week)
        id: starter-prop-evaluate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for cohort_file in data/nfl/starter-cohorts/2026/[0-9][0-9].jsonl; do
            week="$(basename "$cohort_file" .jsonl)"
            week="$((10#$week))"
            echo "[nfl:starter-prop-evaluations] season=2026 week=${week}"
            npm run nfl:starter-prop-evaluations -- --season=2026 --week="${week}"
          done

      # WU6 -- canonical sides (spread) performance artifact. Reads only the
      # already-canonical jkb-power-number spread predictions + the outcome
      # resolver + the predictions' own embedded market_snapshot_refs; writes
      # no model output and grades nothing itself (see
      # scripts/generate-nfl-sides-performance.ts's docblock). Runs first in
      # the performance-artifact chain so overview/health downstream reflect
      # this run's regeneration. Safe when gradedGames=0. continue-on-error,
      # same rationale as every derived-artifact step -- never blocks the
      # load-bearing commit below.
      - name: Generate NFL sides performance artifact
        id: sides-performance
        continue-on-error: true
        shell: bash
        run: npm run nfl:sides-performance

      # WU4 -- canonical totals performance artifact. Reads only already-
      # canonical WU1 predictions + the outcome resolver + betting-lines
      # history; writes no model output and grades nothing itself (see
      # scripts/generate-nfl-totals-performance.ts's docblock). Safe when
      # gradedGames=0 (a valid, correct pregame output, not an error state).
      # continue-on-error, same rationale as every derived-artifact step
      # above -- never blocks the far more load-bearing commit below it.
      - name: Generate NFL totals performance artifact
        id: totals-performance
        continue-on-error: true
        shell: bash
        run: npm run nfl:totals-performance

      # WU4 -- canonical starter-props performance artifact. Reads only the
      # starter-cohort + starter-prop-evaluation archives written above; no
      # grading logic of its own (see scripts/generate-nfl-props-
      # performance.ts's docblock).
      - name: Generate NFL props performance artifact
        id: props-performance
        continue-on-error: true
        shell: bash
        run: npm run nfl:props-performance

      # WU4/WU6 -- thin cross-family overview rollup. Reads only sides.json,
      # totals.json and props.json; runs after all three family artifacts
      # above so it always reflects this run's own regeneration.
      - name: Generate NFL performance overview artifact
        id: performance-overview
        continue-on-error: true
        shell: bash
        run: npm run nfl:performance-overview

      # WU4 -- operational health artifact. Reads only repo artifacts already
      # committed by this pipeline (no live GitHub API calls); runs last so
      # its generated-at-by-artifact map reflects every artifact this same
      # run just wrote.
      - name: Generate NFL performance health artifact
        id: performance-health
        continue-on-error: true
        shell: bash
        run: npm run nfl:performance-health

      - name: Detect meaningful data changes
        id: changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all -- 'public/data/nfl/*/games.json' 'public/data/nfl/*/results.json' 'data/nfl/nflverse/player-week-stats' 'data/nfl/nflverse/play-volume-team-game' 'data/nfl/prediction-outcomes' 'data/nfl/prediction-evaluations' 'data/nfl/starter-prop-evaluations' 'public/data/nfl/performance')" ]; then
            echo "No NFL source or prediction-outcome changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "NFL schedule/result changes detected."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate generated JSON
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          node -e "
            const { existsSync, readFileSync } = require('fs');
            for (let season = 2022; season <= 2026; season += 1) {
              for (const name of ['games.json', 'results.json']) {
                const file = \`public/data/nfl/\${season}/\${name}\`;
                const parsed = JSON.parse(readFileSync(file, 'utf8'));
                if (!parsed._meta || parsed._meta.schemaVersion !== 'nfl-v0.1') {
                  throw new Error(\`\${file} is missing a valid _meta block\`);
                }
              }
            }
            // WU4: only validate a performance artifact when it actually exists --
            // each generation step above runs continue-on-error, so a bug in one
            // must never fail this whole job over an artifact that was never written.
            const expectedSchemaByFile = {
              'public/data/nfl/performance/sides.json': 'nfl-sides-performance-v1',
              'public/data/nfl/performance/totals.json': 'nfl-totals-performance-v1',
              'public/data/nfl/performance/props.json': 'nfl-props-performance-v1',
              'public/data/nfl/performance/overview.json': 'nfl-performance-overview-v1',
              'public/data/nfl/performance/health.json': 'nfl-performance-health-v1',
            };
            for (const [file, expectedSchema] of Object.entries(expectedSchemaByFile)) {
              if (!existsSync(file)) continue;
              const parsed = JSON.parse(readFileSync(file, 'utf8'));
              if (parsed.schemaVersion !== expectedSchema) {
                throw new Error(\`\${file} has unexpected schemaVersion \${parsed.schemaVersion}\`);
              }
            }
            console.log('All generated NFL JSON files are valid.');
          "

      # WU4C.1: outcome and evaluation path validation is delegated to
      # scripts/lib/nfl-prediction-archive-allowlist.mjs (single source of
      # truth, unit-tested) rather than a regex duplicated inline here.
      - name: Commit and push refreshed data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/nfl/*/games.json public/data/nfl/*/results.json

          while IFS= read -r status_line; do
            cache_path="${status_line:3}"
            if [[ ! "$cache_path" =~ ^data/nfl/nflverse/player-week-stats/(stats_player_week_2026\.csv|manifest\.json)$ ]]; then
              echo "Refusing unexpected player-week cache path: $cache_path" >&2
              exit 1
            fi
            git add -- "$cache_path"
          done < <(git status --porcelain --untracked-files=all -- data/nfl/nflverse/player-week-stats)

          # WU4C.1: 2026 play-volume-team-game cache (feeds team_opportunity
          # resolution). Refreshed by the "Refresh 2026 play-volume-team-game
          # cache" step above; absent entirely if that step failed.
          while IFS= read -r status_line; do
            cache_path="${status_line:3}"
            if [[ ! "$cache_path" =~ ^data/nfl/nflverse/play-volume-team-game/(play_volume_team_game_2026\.csv|manifest\.json)$ ]]; then
              echo "Refusing unexpected play-volume cache path: $cache_path" >&2
              exit 1
            fi
            git add -- "$cache_path"
          done < <(git status --porcelain --untracked-files=all -- data/nfl/nflverse/play-volume-team-game)

          while IFS= read -r status_line; do
            outcome_path="${status_line:3}"
            node scripts/lib/nfl-prediction-archive-allowlist.mjs outcomes 2026 "$outcome_path"
            git add -- "$outcome_path"
          done < <(git status --porcelain --untracked-files=all -- data/nfl/prediction-outcomes)

          # WU4C.1 Part 11: WU3 derived evaluation datasets, staged only when
          # the materializer step above actually ran successfully.
          if [ "${{ steps.materialize.outcome }}" = "success" ]; then
            while IFS= read -r status_line; do
              evaluation_path="${status_line:3}"
              node scripts/lib/nfl-prediction-archive-allowlist.mjs evaluations 2026 "$evaluation_path"
              git add -- "$evaluation_path"
            done < <(git status --porcelain --untracked-files=all -- data/nfl/prediction-evaluations)
          else
            echo "::warning::WU3 materialization failed or was skipped; not staging data/nfl/prediction-evaluations this run."
          fi

          # WU4: starter-prop-evaluation partitions (+ sibling exclusion
          # diagnostics), staged only when this run's regrade loop actually
          # ran successfully -- never stage a possibly-partial write from a
          # failed loop.
          if [ "${{ steps.starter-prop-evaluate.outcome }}" = "success" ]; then
            while IFS= read -r status_line; do
              starter_prop_path="${status_line:3}"
              node scripts/lib/nfl-prediction-archive-allowlist.mjs starter-prop-evaluations 2026 "$starter_prop_path"
              git add -- "$starter_prop_path"
            done < <(git status --porcelain --untracked-files=all -- data/nfl/starter-prop-evaluations)
          else
            echo "::warning::WU4 starter-prop-evaluation regrade failed or was skipped; not staging data/nfl/starter-prop-evaluations this run."
          fi

          # WU4: public performance artifacts, staged only when their own
          # generation step actually succeeded this run -- each is
          # independent (a props.json bug must never block staging an
          # already-good totals.json, and vice versa).
          declare -A performance_steps=(
            [public/data/nfl/performance/sides.json]='${{ steps.sides-performance.outcome }}'
            [public/data/nfl/performance/totals.json]='${{ steps.totals-performance.outcome }}'
            [public/data/nfl/performance/props.json]='${{ steps.props-performance.outcome }}'
            [public/data/nfl/performance/overview.json]='${{ steps.performance-overview.outcome }}'
            [public/data/nfl/performance/health.json]='${{ steps.performance-health.outcome }}'
          )
          for performance_file in "${!performance_steps[@]}"; do
            if [ "${performance_steps[$performance_file]}" = "success" ] && [ -f "$performance_file" ]; then
              git add -- "$performance_file"
            else
              echo "::warning::Skipping staging of ${performance_file} (generation step outcome=${performance_steps[$performance_file]})."
            fi
          done

          if git diff --cached --quiet; then
            echo "No staged NFL source or prediction-outcome changes."
            exit 0
          fi

          git commit -m "data(nfl): refresh results and prediction outcomes"

          pushed=false
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase failed on attempt ${attempt}; aborting before retry." >&2
              git rebase --abort || true
            elif git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep $((attempt * 10))
          done

          if [ "$pushed" != "true" ]; then
            echo "ERROR: All push attempts failed — NFL data was not committed." >&2
            exit 1
          fi

          echo "NFL schedules and results pushed successfully."
