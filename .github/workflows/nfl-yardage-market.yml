name: NFL Yardage Market

run-name: NFL Yardage Market • ${{ github.event_name }} • ${{ github.ref_name }}

on:
  schedule:
    # NFL season window only (Sep-Feb); no scheduled run on Monday.
    - cron: "0 8 * 1,2,9,10,11,12 0,2,3,4,5,6"
      timezone: "America/New_York" # 8:00 AM ET Tuesday-Sunday
    - cron: "0 17 * 1,2,9,10,11,12 4"
      timezone: "America/New_York" # 5:00 PM ET Thursday
    - cron: "0 10 * 1,2,9,10,11,12 0"
      timezone: "America/New_York" # 10:00 AM ET Sunday
  workflow_dispatch:

# Share one lock with the other automated workflows that commit generated data to main.
concurrency:
  group: main-data-writers-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-yardage-market:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Both scripts are fail-safe: they exit 0 (non-fatal) whenever
      # PARLAYAPI is unset or the live fetch fails, and only ever append to
      # their archive / overwrite their current-snapshot artifact when they
      # successfully produced new data -- so a failed or empty run never
      # destroys either market's last-known-good state. Each is one ParlayAPI
      # props request (~3 request credits observed live per call).
      - name: Fetch NFL yardage market (ParlayAPI)
        run: npm run nfl:yardage-market
        env:
          PARLAYAPI: ${{ secrets.PARLAYAPI }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Fetch NFL anytime-TD market (ParlayAPI)
        run: npm run nfl:anytime-td-market
        env:
          PARLAYAPI: ${{ secrets.PARLAYAPI }}

      - name: Detect meaningful data changes
        id: changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- 'public/data/nfl/nfl-yardage-market.json' 'data/nfl/props/market-archive/nfl-yardage-market-archive.jsonl' 'public/data/nfl/nfl-anytime-td-market.json' 'data/nfl/props/market-archive/nfl-anytime-td-market-archive.jsonl')" ]; then
            echo "No NFL market changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "NFL market changes detected."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate generated JSON
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          node -e "
            const { readFileSync, existsSync } = require('fs');
            const file = 'public/data/nfl/nfl-yardage-market.json';
            const parsed = JSON.parse(readFileSync(file, 'utf8'));
            if (parsed.schemaVersion !== 'nfl-yardage-market-v1') {
              throw new Error(\`\${file} has unexpected schemaVersion \${parsed.schemaVersion}\`);
            }
            console.log('Generated NFL yardage market artifact is valid.');
            console.log('Coverage gate:', JSON.stringify(parsed.coverage?.readinessGate?.overallReady));

            const tdFile = 'public/data/nfl/nfl-anytime-td-market.json';
            if (existsSync(tdFile)) {
              const tdParsed = JSON.parse(readFileSync(tdFile, 'utf8'));
              if (tdParsed.schemaVersion !== 'nfl-anytime-td-market-v1') {
                throw new Error(\`\${tdFile} has unexpected schemaVersion \${tdParsed.schemaVersion}\`);
              }
              console.log('Generated NFL anytime-TD market artifact is valid.');
              console.log('Canonical anytime-TD quotes:', tdParsed.qa?.playersWithCanonicalQuote);
            }
          "

      - name: Commit and push refreshed data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/nfl/nfl-yardage-market.json data/nfl/props/market-archive/nfl-yardage-market-archive.jsonl public/data/nfl/nfl-anytime-td-market.json data/nfl/props/market-archive/nfl-anytime-td-market-archive.jsonl

          if git diff --cached --quiet; then
            echo "No staged NFL market changes."
            exit 0
          fi

          git commit -m "data(nfl): refresh yardage and anytime-TD market $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"

          pushed=false
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase failed on attempt ${attempt}; aborting before retry." >&2
              git rebase --abort || true
            elif git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep $((attempt * 10))
          done

          if [ "$pushed" != "true" ]; then
            echo "ERROR: All push attempts failed — NFL yardage market was not committed." >&2
            exit 1
          fi

          echo "NFL yardage market pushed successfully."
