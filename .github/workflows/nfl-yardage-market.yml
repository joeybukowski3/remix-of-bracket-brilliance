name: NFL Yardage Market

run-name: NFL Yardage Market • ${{ github.event_name }} • ${{ github.ref_name }}

on:
  schedule:
    # Conservative preseason/Week-1-buildup cadence, NFL season window only
    # (Sep-Feb): one daily refresh plus a couple of game-day windows. This
    # is Phase 10C operational coverage tracking, not a betting-lines feed
    # -- there is no need for hourly polling while book depth is still thin
    # (see Phase 10B/10C QA: DraftKings-only coverage as of checkpoint).
    - cron: "15 9 * 1,2,9,10,11,12 *"
      timezone: "America/New_York" # 9:15 AM ET daily
    - cron: "0 12 * 1,2,9,10,11,12 *"
      timezone: "America/New_York" # 12:00 PM ET game-day refresh (Sun/Thu/Mon slates)
    - cron: "0 16 * 1,2,9,10,11,12 *"
      timezone: "America/New_York" # 4:00 PM ET game-day refresh
  workflow_dispatch:

# Share one lock with the other automated workflows that commit generated data to main.
concurrency:
  group: main-data-writers-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-yardage-market:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The script itself is fail-safe: it exits 0 (non-fatal) whenever
      # PARLAYAPI is unset or the live fetch fails, and only ever appends to
      # the archive / overwrites the current-snapshot and QA artifacts when
      # it successfully produced new data -- so a failed or empty run never
      # destroys the last-known-good market state.
      - name: Fetch NFL yardage market (ParlayAPI)
        run: npm run nfl:yardage-market
        env:
          PARLAYAPI: ${{ secrets.PARLAYAPI }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Detect meaningful data changes
        id: changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- 'public/data/nfl/nfl-yardage-market.json' 'data/nfl/props/market-archive/nfl-yardage-market-archive.jsonl')" ]; then
            echo "No NFL yardage market changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "NFL yardage market changes detected."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate generated JSON
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          node -e "
            const { readFileSync } = require('fs');
            const file = 'public/data/nfl/nfl-yardage-market.json';
            const parsed = JSON.parse(readFileSync(file, 'utf8'));
            if (parsed.schemaVersion !== 'nfl-yardage-market-v1') {
              throw new Error(\`\${file} has unexpected schemaVersion \${parsed.schemaVersion}\`);
            }
            console.log('Generated NFL yardage market artifact is valid.');
            console.log('Coverage gate:', JSON.stringify(parsed.coverage?.readinessGate?.overallReady));
          "

      - name: Commit and push refreshed data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/nfl/nfl-yardage-market.json data/nfl/props/market-archive/nfl-yardage-market-archive.jsonl

          if git diff --cached --quiet; then
            echo "No staged NFL yardage market changes."
            exit 0
          fi

          git commit -m "data(nfl): refresh yardage market $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"

          pushed=false
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase failed on attempt ${attempt}; aborting before retry." >&2
              git rebase --abort || true
            elif git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep $((attempt * 10))
          done

          if [ "$pushed" != "true" ]; then
            echo "ERROR: All push attempts failed — NFL yardage market was not committed." >&2
            exit 1
          fi

          echo "NFL yardage market pushed successfully."
