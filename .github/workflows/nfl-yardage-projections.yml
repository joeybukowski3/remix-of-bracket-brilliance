name: NFL Yardage Projections

run-name: NFL Yardage Projections • ${{ github.event_name }} • ${{ github.ref_name }}

# Owns its own load-bearing input sequence end to end -- refreshes the
# shared weekly-roster cache, the depth-chart cache, and the descriptive
# matchup-market artifact itself before regenerating
# public/data/nfl/{season}/yardage-projections.json, rather than depending on
# nfl-matchup-market.yml (a separate, independently-scheduled workflow) to
# have already run. Every step below runs WITHOUT continue-on-error: a
# failure in any prerequisite step stops the job before the commit step is
# ever reached, so last-known-good projections are never overwritten by a
# partial or degraded refresh. This mirrors -- never loosens -- the
# fail-closed behavior each underlying script already implements on its own
# (see the scripts themselves for their individual fail-closed contracts).
#
# Provenance-only-commit contract (verified by running the full sequence
# twice locally against identical upstream data): matchup-market.json writes
# a fresh _meta.generatedAt/provenance.retrievedAt on every successful run
# regardless of whether games.csv content changed, and
# yardage-projections.json writes a fresh top-level generatedAt PLUS a fresh
# generatedAt on every row and every row's embedded matchupScore, also
# regardless of whether projectedYards/matchupScore/any indicator actually
# changed. So one successful daily projection refresh may produce a
# provenance-only commit even when projected yard values are unchanged. That
# is acceptable and intentional, not a bug to suppress -- the Yardage Props
# Review page's freshness UI reads these timestamps, and the daily run
# itself is a new verified live-artifact refresh even when it reproduces the
# same numbers. The WU1 immutable archive separately deduplicates an exact
# material-state rerun. Given this, the "Detect meaningful data changes" step below
# is a defense-in-depth sanity check, not a no-op/commit-skip mechanism: in
# real operation, a successful run is expected to always have something
# staged to commit.
on:
  schedule:
    # 9:30 AM ET daily during the NFL season window (Sep-Feb) -- after the
    # 6:10 AM schedules/results, 6:40 AM matchup-market, 7:40 AM team-ratings,
    # 7:55 AM performance-analytics and 8:10 AM matchup-projections refreshes
    # have all landed, so the schedule this run's own week-resolution step
    # reads is already current for the day. A single daily run is sufficient:
    # the upstream depth-chart/roster sources this pipeline refreshes are
    # themselves daily snapshots (see refresh-nfl-depth-chart-source-cache.mjs),
    # so a same-day second run would only ever re-fetch identical upstream
    # data -- no player-role or game-environment freshness would be gained.
    # This is a role/environment freshness cadence, not a sportsbook-line
    # cadence; nfl-yardage-market.yml's 3x/day cadence is deliberately not
    # duplicated here.
    - cron: "30 9 * 1,2,9,10,11,12 *"
      timezone: "America/New_York"
  workflow_dispatch:

# Share one lock with the other automated workflows that commit generated data to main.
concurrency:
  group: main-data-writers-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-yardage-projections:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Step 1/5 -- shared weekly-roster cache (data/nfl/nflverse/weekly-rosters).
      # Fail-closed: leaves the existing committed cache untouched and exits
      # non-zero on any fetch/validation failure, which stops this job here.
      - name: Refresh shared weekly-roster cache
        run: npm run nfl:weekly-roster-cache

      # Step 2/5 -- depth-chart source cache (data/nfl/nflverse/depth-charts).
      # --seasons=2026: the underlying script defaults to [2025, 2026], but
      # this live daily workflow has no reason to refetch/reprocess the
      # closed 2025 season every run -- 2026 is the only season this
      # pipeline's projections ever read. The script itself is unmodified;
      # this only narrows which of its already-supported --seasons values
      # this workflow passes. Fail-closed the same way: existing 2026 cache
      # untouched on failure.
      - name: Refresh depth-chart source cache (2026 only)
        run: npm run nfl:depth-chart-cache -- --seasons=2026

      # Step 3/5 -- descriptive matchup/game market (public/data/nfl/matchup-market.json).
      # Fail-closed: existing artifact untouched on failure. Descriptive only
      # (no spread/edge/pick/EV) -- see generate-nfl-matchup-market.mjs.
      - name: Refresh matchup/game market
        run: npm run nfl:matchup-market

      # Resolves (season, week) for step 4 by reusing the same
      # resolveCurrentWeek() the yardage-market pipeline already relies on
      # (earliest week with a not-yet-final game in the just-verified
      # schedule) -- never re-derives current-week logic.
      - name: Resolve current NFL week
        id: current-week
        # --silent: suppress npm's own "> pkg@ver script" banner lines, which
        # are not valid `key=value` GITHUB_OUTPUT entries.
        run: npm run --silent nfl:resolve-current-week >> "$GITHUB_OUTPUT"

      # WU4C.1 -- generate WU4A team opportunity BEFORE current-week
      # projections, on this same fresh runner. No continue-on-error: a
      # failure here stops the job before the projections step below ever
      # runs, which is what guarantees the "Generate current-week yardage
      # projections" step -- and therefore WU4B receiving v2 -- can only ever
      # see a team-opportunity.json that THIS run just wrote, never a stale
      # artifact left over from a prior run or a different week (see
      # generate-nfl-current-week-yardage-projections.ts's week-matched
      # read of public/data/nfl/{season}/team-opportunity.json).
      - name: Generate WU4A team opportunity
        run: npm run nfl:team-opportunity -- --season=${{ steps.current-week.outputs.season }} --week=${{ steps.current-week.outputs.week }}

      # Step 4/5 -- regenerate the production-candidate projection artifact.
      # No fetch/normalization logic of its own: reuses every already-
      # committed historical artifact plus the caches refreshed in steps 1-3
      # and this run's own team-opportunity.json above. Projection formulas
      # are untouched by this checkpoint. receiving v2 activates only when
      # this run's team-opportunity.json has rows for this exact week (see
      # generate-nfl-current-week-yardage-projections.ts); it is NOT
      # fail-closed on its own -- a genuine WU4A gap (e.g. bye-week-only
      # slate quirks) degrades receiving to v1 rather than failing the whole
      # projections run, and is disclosed via the log line below.
      - name: Generate current-week yardage projections
        run: npm run nfl:current-week-projections -- --season=${{ steps.current-week.outputs.season }} --week=${{ steps.current-week.outputs.week }}

      # Step 5/5 -- validate before ever staging for commit. Independently
      # recomputes the expected game-id set from the just-verified schedule
      # rather than only trusting the artifact's self-reported QA counts.
      - name: Validate generated projection artifact
        run: npm run nfl:validate-current-week-projections -- --season=${{ steps.current-week.outputs.season }} --week=${{ steps.current-week.outputs.week }}

      # Defense-in-depth only, NOT a real no-op/commit-skip mechanism: both
      # matchup-market.json and yardage-projections.json write a fresh
      # provenance/generatedAt timestamp on every successful run regardless
      # of whether the underlying data changed (verified above), so this
      # check is expected to find something staged on essentially every
      # successful run. It still exists to (a) skip a push entirely on the
      # rare day nothing in the allowlist changed at all, and (b) guard
      # against a future change to either generator that stops
      # unconditionally stamping a new timestamp.
      - name: Check for staged changes
        id: changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- \
            'data/nfl/nflverse/weekly-rosters/roster_weekly_2026.csv' \
            'data/nfl/nflverse/weekly-rosters/manifest.json' \
            'data/nfl/nflverse/depth-charts/depth_charts_2026.csv' \
            'data/nfl/nflverse/depth-charts/manifest.json' \
            'public/data/nfl/matchup-market.json' \
            'public/data/nfl/${{ steps.current-week.outputs.season }}/team-opportunity.json' \
            'public/data/nfl/${{ steps.current-week.outputs.season }}/yardage-projections.json' \
            ':(glob)data/nfl/predictions/${{ steps.current-week.outputs.season }}/[0-9][0-9]/nfl-*.jsonl' \
            ':(glob)data/nfl/predictions/manifests/sources/[0-9a-f]*.json' \
            ':(glob)data/nfl/predictions/manifests/fitted-models/[0-9a-f]*.json')" ]; then
            echo "No NFL yardage-projection input/output changes (unexpected on a successful run -- see the provenance-only-commit note above)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "NFL yardage-projection input/output changes detected (expected on every successful run -- at minimum a provenance/generatedAt refresh)."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Commit allowlist: ONLY the canonical caches/artifacts this pipeline
      # legitimately refreshes. Deliberately excludes
      # depth_charts_2025.csv (this workflow only ever refreshes 2026, see
      # above), matchup-epa.json, matchup-success-rates.json,
      # matchup-production-allowed.json and nfl-yardage-market.json -- none
      # of those feed projectedYards and none are touched by any step above.
      #
      # WU4C.1: prediction-archive partition validation is delegated to
      # scripts/lib/nfl-prediction-archive-allowlist.mjs (single source of
      # truth, unit-tested in nfl-prediction-archive-allowlist.test.mjs)
      # rather than a regex duplicated inline here.
      - name: Commit and push refreshed data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/nfl/nflverse/weekly-rosters/roster_weekly_2026.csv \
            data/nfl/nflverse/weekly-rosters/manifest.json \
            data/nfl/nflverse/depth-charts/depth_charts_2026.csv \
            data/nfl/nflverse/depth-charts/manifest.json \
            public/data/nfl/matchup-market.json \
            public/data/nfl/${{ steps.current-week.outputs.season }}/team-opportunity.json \
            public/data/nfl/${{ steps.current-week.outputs.season }}/yardage-projections.json

          # Stage only WU1 prediction-archive partitions (spread/passing/
          # rushing/receiving/team_opportunity) and their content-addressed
          # source/fitted-model manifests. Every path is discovered from the
          # clean workflow checkout and validated against the shared
          # allowlist module before staging -- it fails closed (exit 1) on
          # anything unrecognized.
          archive_season='${{ steps.current-week.outputs.season }}'
          while IFS= read -r -d '' entry; do
            archive_path="${entry:3}"
            node scripts/lib/nfl-prediction-archive-allowlist.mjs predictions "$archive_season" "$archive_path"
            git add -- "$archive_path"
          done < <(git status --porcelain=v1 -z --untracked-files=all -- data/nfl/predictions)

          if git diff --cached --quiet; then
            echo "No staged NFL yardage-projection changes."
            exit 0
          fi

          git commit -m "data(nfl): refresh yardage projection inputs + regenerate (season ${{ steps.current-week.outputs.season }} week ${{ steps.current-week.outputs.week }}) $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"

          pushed=false
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase failed on attempt ${attempt}; aborting before retry." >&2
              git rebase --abort || true
            elif git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep $((attempt * 10))
          done

          if [ "$pushed" != "true" ]; then
            echo "ERROR: All push attempts failed — NFL yardage projections were not committed." >&2
            exit 1
          fi

          echo "NFL yardage projections pushed successfully."
