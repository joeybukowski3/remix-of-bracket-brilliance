name: Poll MLB X Posts

# DISABLED as a live-posting path (Phase 7 cutover,
# .github/workflows/mlb-x-canonical.yml). The canonical publisher is now the
# ONLY code path allowed to submit a real MLB HR/K public X post. The
# `schedule` trigger that used to fire this workflow every 15 minutes is
# removed, and the post-hr/post-k jobs that used to call
# scripts/post-mlb-{hr-props,strikeout-props}-to-x.mjs --post are removed
# entirely -- there is no typed override, no flag, no input anywhere in this
# file that can submit a real X post. If emergency posting is ever needed,
# it must be implemented through the canonical publisher so it respects
# canonical receipt identity (mlb-x/{date}/canonical/{product}.json) --
# never through this file.
#
# The `plan` job is retained: it only calls scripts/plan-mlb-x-posts.mjs, a
# read-only diagnostic that reports HR/K posting-window status and never
# calls X or writes a posting receipt. Useful for manual observability into
# what the (now-retired) polling logic would have decided.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      slate_date: ${{ steps.poll.outputs.slate_date }}
      both_posted: ${{ steps.poll.outputs.both_posted }}
      hr_should_run: ${{ steps.poll.outputs.hr_should_run }}
      k_should_run: ${{ steps.poll.outputs.k_should_run }}
      hr_status: ${{ steps.poll.outputs.hr_status }}
      k_status: ${{ steps.poll.outputs.k_status }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute ET slate date
        id: et_date
        shell: bash
        run: echo "date=$(TZ=America/New_York date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build shared poll plan (diagnostic only -- no X call, no receipt write)
        id: poll
        run: node scripts/plan-mlb-x-posts.mjs

      - name: Summary
        if: always()
        run: |
          echo "slate date: ${{ steps.poll.outputs.slate_date || steps.et_date.outputs.date }}"
          echo "both already posted: ${{ steps.poll.outputs.both_posted || 'unknown' }}"
          echo "HR: ${{ steps.poll.outputs.hr_status || 'unknown' }}"
          echo "K: ${{ steps.poll.outputs.k_status || 'unknown' }}"
          echo "This workflow cannot submit a real X post -- see the header banner."
