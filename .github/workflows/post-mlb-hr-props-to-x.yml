name: Post MLB HR Props to X

# DISABLED as a live-posting path (Phase 7 cutover,
# .github/workflows/mlb-x-canonical.yml). The canonical publisher is now the
# ONLY code path allowed to submit a real MLB HR public X post -- it alone
# reads/writes the canonical git-backed receipt
# (mlb-x/{date}/canonical/mlb-hr-props.json) and holds the canonical
# publication lease. This workflow can no longer reach a live post through
# ANY trigger: `mode` offers only dry-run/verify-account (neither ever calls
# X to post), and X_ALLOW_LIVE_POST is never set in the environment at all --
# there is no typed override, no flag, no input that re-enables posting. If
# emergency posting is ever needed, it must be implemented through the
# canonical publisher so it respects canonical receipt identity -- never
# through this file.
#
# Retained for forensic/manual dry-run investigation of the legacy
# selection/rendering pipeline only. Automatic earliest-first-pitch polling
# used to be owned by poll-mlb-x-posts.yml, which is itself retired in the
# same cutover (see that workflow's own header comment).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode (live posting removed in Phase 7 -- dry-run/verify-account only)"
        required: true
        default: "dry-run"
        type: choice
        options: [dry-run, verify-account]
      data_source:
        description: "Data source"
        required: true
        default: "production"
        type: choice
        options: [production, github, local]

concurrency:
  group: post-mlb-hr-props-to-x
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post-hr-props-to-x:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    env:
      X_EXPECTED_USERNAME: _joeknowsball_
      JKB_X_API_KEY: ${{ secrets.JKB_X_API_KEY }}
      JKB_X_API_SECRET: ${{ secrets.JKB_X_API_SECRET }}
      JKB_X_ACCESS_TOKEN: ${{ secrets.JKB_X_ACCESS_TOKEN }}
      JKB_X_ACCESS_SECRET: ${{ secrets.JKB_X_ACCESS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # The confirmed-only screenshot is rendered from the immutable selection
      # artifact against the bare /mlb/hr-props/x-export route served LOCALLY
      # (scripts/lib/mlb-x-local-preview-server.mjs), so it never depends on a
      # production deploy and can never drift from the selected rows. That
      # needs the built SPA in dist/.
      - name: Build site for local export render
        run: npm run build

      - name: Run HR props script (dry-run/verify-account only)
        id: post
        shell: bash
        run: |
          MODE="${{ inputs.mode || 'dry-run' }}"
          echo "Mode: $MODE"
          echo "Data source: ${{ inputs.data_source || 'production' }}"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          HR_PROPS_DATA_SOURCE="${{ inputs.data_source || 'production' }}" node scripts/post-mlb-hr-props-to-x.mjs "--${MODE}"
        # X_ALLOW_LIVE_POST is deliberately NOT set anywhere in this file.
        # assertLivePostAllowed/normalizeAllowLivePostFlag treat an unset
        # value as fail-closed -- there is no environment variable, input, or
        # override anywhere here that can make this script call X to post.
        # See the header banner above.

      - name: Upload dry-run selection + screenshot
        if: inputs.mode == 'dry-run'
        uses: actions/upload-artifact@v4
        with:
          name: mlb-hr-props-x-dry-run
          path: |
            artifacts/mlb-hr-props-x.png
            artifacts/mlb-hr-props-x-selection.json
          if-no-files-found: error

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "== Post MLB HR Props to X summary (dry-run/verify-account only) =="
          echo "resolved mode: ${{ steps.post.outputs.mode || 'n/a' }}"
          echo "This workflow cannot submit a real X post -- see the header banner."
