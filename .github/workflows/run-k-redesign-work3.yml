name: Run isolated K redesign

on:
  push:
    branches:
      - work3/mlb-k-prop-table-and-splits-redesign

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[k-redesign-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work3/mlb-k-prop-table-and-splits-redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Extract reviewed UI transformer
        run: |
          git fetch origin feat/mlb-k-prop-table-and-splits-redesign
          python - <<'PY'
          from pathlib import Path
          import subprocess
          text = subprocess.check_output([
              "git", "show", "origin/feat/mlb-k-prop-table-and-splits-redesign:.github/workflows/apply-k-prop-redesign-temp.yml"
          ], text=True)
          lines = text.splitlines()
          name_index = next(i for i, line in enumerate(lines) if line.strip() == "name: Apply source changes")
          run_index = next(i for i in range(name_index + 1, len(lines)) if lines[i].strip() == "run: |")
          end_index = next(i for i in range(run_index + 1, len(lines)) if lines[i].startswith("      - "))
          script_lines = lines[run_index + 1:end_index]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in script_lines) + "\n"
          Path("/tmp/apply-k-redesign.py").write_text(script, encoding="utf-8")
          PY
          python /tmp/apply-k-redesign.py
      - name: Wire sourced last-10 K context into UI
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/pages/MlbStrikeoutProps.tsx")
          text = path.read_text(encoding="utf-8")
          old = 'last10?: { xba?: number | null };'
          new = 'last10?: { kPerNine?: number | null; xba?: number | null };'
          if old not in text:
              raise SystemExit("opponentContext last10 type anchor not found")
          text = text.replace(old, new, 1)
          old = 'opponentLast10K9: detail?.opponentLastFiveVsStartersSummary?.averageTeamStrikeouts ?? null,'
          new = 'opponentLast10K9: context?.opponentContext?.last10?.kPerNine ?? detail?.opponentLastFiveVsStartersSummary?.averageTeamStrikeouts ?? null,'
          if old not in text:
              raise SystemExit("last10 K display anchor not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
      - name: Install dependencies
        run: npm ci
      - name: Validate data-source scripts
        run: |
          node --check scripts/lib/mlb-opponent-k-context.mjs
          node --check scripts/generate-mlb-strikeout-prop-details.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Focused tests
        run: npx vitest run src/pages/MlbStrikeoutProps*.test.tsx src/components/mlb/MlbStrikeoutPropRowDetail*.test.tsx --passWithNoTests
      - name: Build
        run: npm run build
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/MlbStrikeoutProps.tsx src/components/mlb/MlbStrikeoutPropRowDetail.tsx scripts/lib/mlb-opponent-k-context.mjs scripts/generate-mlb-strikeout-prop-details.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "feat: redesign MLB K prop table and source opponent context [k-redesign-applied]"
          git push origin HEAD:work3/mlb-k-prop-table-and-splits-redesign
